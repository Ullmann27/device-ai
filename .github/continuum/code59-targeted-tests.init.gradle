gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) throw new GradleException('Missing Android app')
    app.tasks.withType(org.gradle.api.tasks.testing.Test).matching {
        it.name == 'testDebugUnitTest'
    }.configureEach {
        filter {
            includeTestsMatching 'at.heinz.deviceai.ContinuumUiSnapshotUiTest'
            includeTestsMatching 'at.heinz.deviceai.OwnerAppActionWorkSceneUiTest'
            includeTestsMatching 'at.heinz.deviceai.OwnerFactRevocationUiTest'
            includeTestsMatching 'at.heinz.deviceai.chief.FirstThinkingRunE2ETest'
            includeTestsMatching 'at.heinz.deviceai.chief.ChiefPatternE2ETest'
            includeTestsMatching 'at.heinz.deviceai.avatar3d.AvatarLiveDiagnosticsTest'
            includeTestsMatching 'at.heinz.deviceai.ContinuumAvatar3dLifecycleUiTest'
            failOnNoMatchingTests = true
        }
    }
}
