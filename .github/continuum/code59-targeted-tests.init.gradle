            includeTestsMatching 'at.heinz.deviceai.chief.FirstThinkingRunE2ETest'
            includeTestsMatching 'at.heinz.deviceai.chief.ChiefPatternE2ETest'
            includeTestsMatching 'at.heinz.deviceai.avatar3d.AvatarLiveDiagnosticsTest'
            includeTestsMatching 'at.heinz.deviceai.ContinuumAvatar3dLifecycleUiTest'
            includeTestsMatching 'at.heinz.deviceai.cognitive.BoundedThinkingMemoryTest'
            includeTestsMatching 'at.heinz.deviceai.learning.ContinuumThinkingMemoryTest'
            includeTestsMatching 'at.heinz.deviceai.chief.RoutineDeliveryTest'
            includeTestsMatching 'at.heinz.deviceai.chief.RoutineRestartIdentityTest'
            includeTestsMatching 'at.heinz.deviceai.chief.PersistentRoutineDeliveryTest'
            includeTestsMatching 'at.heinz.deviceai.chief.RoutineRevokedAdmissionContractTest'
