// Isolate the actual Android thermal guard behavior for the newly introduced tool-free path.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) throw new GradleException('Missing Android app')
    app.tasks.withType(org.gradle.api.tasks.testing.Test).matching { it.name == 'testDebugUnitTest' }.configureEach {
        filter {
            includeTestsMatching 'at.heinz.deviceai.localmodel.LocalModelThermalGuardTest'
            failOnNoMatchingTests = true
        }
    }
}
