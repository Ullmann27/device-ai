// Fold7 context capacity and long-answer tests, real Android source in debug QA mode.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) throw new GradleException('Missing Android app')
    app.tasks.withType(org.gradle.api.tasks.testing.Test).matching { it.name == 'testDebugUnitTest' }.configureEach {
        filter {
            includeTestsMatching 'at.heinz.deviceai.localmodel.LocalModelContextWindowTest'
            includeTestsMatching 'at.heinz.deviceai.localmodel.LocalNativePromptBudgetTest'
            includeTestsMatching 'at.heinz.deviceai.localmodel.LocalModelGenerationPolicyTest'
            includeTestsMatching 'at.heinz.deviceai.cognitive.LocalChatPromptBudgetTest'
            includeTestsMatching 'at.heinz.deviceai.cognitive.LocalPromptFrameTest'
            includeTestsMatching 'at.heinz.deviceai.cognitive.AiContextCompilerTest'
            includeTestsMatching 'at.heinz.deviceai.cognitive.LocalTextOnlyInferenceRouteTest'
            includeTestsMatching 'at.heinz.deviceai.cognitive.OwnerDocumentDialogueTest'
            includeTestsMatching 'at.heinz.deviceai.cognitive.DocumentDraftPromptTest'
            includeTestsMatching 'at.heinz.deviceai.cognitive.LocalDecisionPromptFrameTest'
            includeTestsMatching 'at.heinz.deviceai.cognitive.OwnerObjectScopeCorrectionTest'
            includeTestsMatching 'at.heinz.deviceai.cognitive.OwnerSessionObjectUtteranceTest'
            includeTestsMatching 'at.heinz.deviceai.cognitive.OwnerDocumentIntentTest'
            includeTestsMatching 'at.heinz.deviceai.cognitive.OwnerComputerIntentParserTest'
            includeTestsMatching 'at.heinz.deviceai.ContinuumHologramMotionUiTest'
            failOnNoMatchingTests = true
        }
    }
}
