name: "Code58 date-tail support regressions"
on:
  push:
    branches:
      - work/code58-date-tail-support-20261114
permissions:
  contents: read
jobs:
  android-support:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: |
          set -Eeuo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Shared Android matrix plus date regressions
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --no-build-cache --max-workers=1 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx2200m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:ActiveProcessorCount=2' \
            -Pkotlin.compiler.execution.strategy=in-process -PdeviceAiMentorPreview=true \
            -PcontinuumOwnerArm64=true -PcontinuumStandaloneVersionCode=58 \
            -PcontinuumLocalStandaloneQa=true -PcontinuumUiWidgetTests=true \
            -I docs/evidence/omega-apk54-20261111/harness/test-memory.gradle \
            -I .github/continuum/code58-fold7-routing-tests.init.gradle \
            -I .github/continuum/code58-date-tail-tests.init.gradle :app:testDebugUnitTest
      - name: Verify real cases and unchanged shared coverage
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          paths = pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')
          cases = [c for p in paths for c in ET.parse(p).getroot().iter('testcase')]
          assert len(cases) >= 373, f'Unexpectedly reduced shared coverage: {len(cases)}'
          assert not any(c.find(n) is not None for c in cases for n in ('failure','error','skipped'))
          actual = {c.get('name') for c in cases if c.get('classname','').endswith('.ProactiveDateTailRegressionTest')}
          required = {'dottedClockValuesPreserveToday', 'quantitiesStaySeparateFromTheYear',
                      'invalidClocksAndIdentifiersDoNotBecomeQuantities', 'explicitYearAndCalendarDayRemainAuthoritative',
                      'trustAndRelativeFreshnessAreNotRelaxed', 'correctedDateStillRespectsAnnouncementCooldown'}
          assert actual == required, f'Missing date cases: {required - actual}'
          print(f'CODE58_DATE_SUPPORT_PASS={len(cases)} FAILED=0 SKIPPED=0')
          PY
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Code58-date-support-JUnit
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
  node-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - name: Critical source contracts
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/continuum-reliability-qa.mjs critical --out "$RUNNER_TEMP/date-support-critical"
      - name: Preserve contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Code58-date-support-Node
          path: ${{ runner.temp }}/date-support-critical/
          if-no-files-found: warn
          retention-days: 14
