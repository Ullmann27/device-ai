name: Continuum Branch Regression Tests

on:
  push:
    branches:
      - "copilot/**"
      - "continuum/argon-safety-review-20261017"
    paths:
      - ".github/continuum/**"
      - "backend/**"
      - "scripts/local-m4-android.sh"
      - ".github/workflows/continuum-branch-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuum-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend HTTP test dependencies
        run: npm install --prefix backend --ignore-scripts --no-audit --no-fund
      - name: M4 end-to-end repair acceptance
        run: node --test --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/continuum-m4-repair-junit.xml" .github/continuum/repair-loop.test.mjs .github/continuum/repair-cycle-safety.integration.test.mjs
      - name: Full Continuum Node regressions
        run: node --test --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/continuum-node-junit.xml" --test-concurrency=2 .github/continuum/*.test.mjs
      - name: Backend Node regressions
        run: node --test --test-reporter=junit --test-reporter-destination="$RUNNER_TEMP/backend-node-junit.xml" --test-concurrency=2 backend/test/*.test.js
      - name: Validate executed M4 regression evidence
        run: node .github/continuum/m4-junit-evidence.mjs "$RUNNER_TEMP/continuum-m4-repair-junit.xml" "$RUNNER_TEMP/continuum-node-junit.xml" "$RUNNER_TEMP/backend-node-junit.xml"
      - name: Publish M4 test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Continuum-M4-Node-Backend-evidence
          path: |
            ${{ runner.temp }}/continuum-m4-repair-junit.xml
            ${{ runner.temp }}/continuum-node-junit.xml
            ${{ runner.temp }}/backend-node-junit.xml
          if-no-files-found: error
