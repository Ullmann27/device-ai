name: "Continuum Code51/55 — Originalsignierung und GitHub-Release"

# Existing registered path; manual owner sign-and-publish approval remains mandatory.
# Nur manueller Start. Die Kanalwahl ersetzt NICHT die ausdrückliche SHA-Freigabe des Besitzers:
# - owner_approved_sha muss exakt dem Quell-Commit entsprechen (bewusste Eingabe des Besitzers),
# - das Environment continuum-original-signing muss Pflicht-Reviewer (Besitzer) und genau die Branch-Regel
#   des Staging-Zweigs haben; sonst bricht der Preflight ab, bevor ein Geheimnis freigegeben wird.
# Der Workflow liest, druckt und kopiert P12/Passwort nie.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exakter 40-stelliger Quell-Commit (muss dem HEAD des Branches entsprechen)"
        required: true
        type: string
      qa_run_id:
        description: "Exakter grüner Voll-QA-Lauf: Code51 historischer Pfad oder Code55 full-qa"
        required: true
        type: string
      apk_run_id:
        description: "Code55: grüner owner-apk-Lauf desselben SHA; für Code51 leer lassen"
        required: false
        type: string
      owner_approved_sha:
        description: "Besitzerfreigabe dieses exakten SHA: Originalsignierung UND Veröffentlichung als neuester GitHub-Release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: continuum-original-sign-only
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'Ullmann27/device-ai' && (github.ref == 'refs/heads/copilot/code51-master-integrator-20261108' || github.ref == 'refs/heads/integrate/code55-apk-fable-20261112')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        if: github.ref == 'refs/heads/integrate/code55-apk-fable-20261112'
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        if: github.ref == 'refs/heads/integrate/code55-apk-fable-20261112'
        with:
          node-version: "24.22.2"
      - name: Prepare Code55 public verification tools
        if: github.ref == 'refs/heads/integrate/code55-apk-fable-20261112'
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - name: Preflight without secrets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          QA_RUN_ID: ${{ inputs.qa_run_id }}
          APK_RUN_ID: ${{ inputs.apk_run_id }}
          OWNER_APPROVED_SHA: ${{ inputs.owner_approved_sha }}
        run: |
          set -euo pipefail
          bash scripts/continuum-code50-github-signer.sh preflight

  release-original-signed:
    needs: preflight
    if: github.repository == 'Ullmann27/device-ai' && (github.ref == 'refs/heads/copilot/code51-master-integrator-20261108' || github.ref == 'refs/heads/integrate/code55-apk-fable-20261112')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: continuum-original-signing
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        if: github.ref == 'refs/heads/integrate/code55-apk-fable-20261112'
        with:
          node-version: "24.22.2"
      - name: Prepare official Android 35 signing tools
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
      - name: Verify exact-source QA, sign with original key and publish verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          QA_RUN_ID: ${{ inputs.qa_run_id }}
          APK_RUN_ID: ${{ inputs.apk_run_id }}
          OWNER_APPROVED_SHA: ${{ inputs.owner_approved_sha }}
          ORIGINAL_P12: ${{ secrets.CONTINUUM_LOCAL_SIGNING_P12_BASE64 }}
          ORIGINAL_PASSWORD: ${{ secrets.CONTINUUM_LOCAL_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          bash scripts/continuum-code50-github-signer.sh sign
