name: Continuum Zero-Cost Core

on:
  push:
    branches: ["copilot/pr-12-working-first-vertical-slice"]
    paths: [".github/workflows/continuum-zero-cost.yml"]
  schedule:
    - cron: "37 */4 * * *"
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Shared with every version of this workflow, including the default branch.
concurrency:
  group: continuum-zero-cost
  cancel-in-progress: false

jobs:
  live-core:
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.number == 20 &&
       github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CONTINUUM_COPILOT: "0"
    steps:
      - name: Checkout verified learning implementation
        uses: actions/checkout@v4
        with:
          ref: a3bca34f4f2843875bd907954991ee9a5d9638ed
          fetch-depth: 1

      - name: Load existing persistent state (fail closed)
        shell: bash
        run: |
          git fetch origin continuum-state:refs/remotes/origin/continuum-state
          mkdir -p .continuum
          git show origin/continuum-state:.continuum/state.json > .continuum/state.json
          test -s .continuum/state.json
          echo "CONTINUUM_CODE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test replay, benchmarks, console and model interchange
        run: node --test .github/continuum/*.test.mjs

      - name: Run bounded research and neural learning
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CONTINUUM_EVENT: ${{ github.event_name }}
          CONTINUUM_REPOSITORY: ${{ github.repository }}
          CONTINUUM_ISSUE: "20"
          CONTINUUM_COMMENT: ${{ github.event.comment.body || '' }}
          CONTINUUM_COMMENT_USER: ${{ github.event.comment.user.login || '' }}
        run: node .github/continuum/zero-cost-core.mjs

      - name: Persist state, public weights and measurements together
        shell: bash
        run: |
          state_checkout="$RUNNER_TEMP/continuum-state-publish"
          git worktree add --detach "$state_checkout" refs/remotes/origin/continuum-state
          mkdir -p "$state_checkout/.continuum"
          cp .continuum/state.json .continuum/neural-public.bin .continuum/neural-public.json "$state_checkout/.continuum/"
          git -C "$state_checkout" config user.name "device-ai-continuum[bot]"
          git -C "$state_checkout" config user.email "device-ai-continuum[bot]@users.noreply.github.com"
          git -C "$state_checkout" add .continuum/state.json .continuum/neural-public.bin .continuum/neural-public.json
          if ! git -C "$state_checkout" diff --cached --quiet; then
            git -C "$state_checkout" commit -m "chore(continuum): persist evaluated neural learning and memory"
            git -C "$state_checkout" push origin HEAD:continuum-state
          fi

      - name: Export Android-compatible public model (no private memory)
        uses: actions/upload-artifact@v4
        with:
          name: Continuum-neural-public-${{ github.run_id }}
          path: |
            .continuum/neural-public.bin
            .continuum/neural-public.json
          retention-days: 7
          if-no-files-found: error
