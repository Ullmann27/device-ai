name: PR17 bounded sanitizer repair and verification

on:
  push:
    branches:
      - copilot/fix-64243701-1415878393-f443f816-2b3d-4c73-8097-d7df0cb722ca
    paths:
      - '.github/workflows/pr17-sanitizer-repair.yml'
      - 'app/src/main/java/at/heinz/deviceai/cognitive/BoundedResearchTextSanitizer.kt'
      - 'app/src/test/java/at/heinz/deviceai/cognitive/ResearchSanitizerBudgetTest.kt'

permissions:
  contents: read

concurrency:
  group: pr17-bounded-sanitizer-maintenance
  cancel-in-progress: false

jobs:
  patch:
    if: >-
      github.event.head_commit.message == 'fix(research): stage bounded sanitizer and guarded PR17 repair'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      patched_sha: ${{ steps.patch.outputs.patched_sha }}
    steps:
      - name: Apply one guarded source replacement
        id: patch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'Ullmann27';
            const repo = 'device-ai';
            const branch = "copilot/fix-64243701-1415878393-f443f816-2b3d-4c73-8097-d7df0cb722ca";
            const path = 'app/src/main/java/at/heinz/deviceai/cognitive/ResearchEngine.kt';
            if (context.repo.owner !== owner || context.repo.repo !== repo || context.ref !== `refs/heads/${branch}`) {
              throw new Error('Repository/branch guard failed; main is never a target.');
            }
            const head = context.sha;
            const current = await github.rest.repos.getBranch({owner, repo, branch});
            if (current.data.commit.sha !== head) throw new Error('Stale workflow head.');
            const parent = await github.rest.git.getCommit({owner, repo, commit_sha: head});
            if (parent.data.parents.length !== 1 || parent.data.parents[0].sha !== '1ed6b96fcf1af8dd0c94bde30180d9ed5dc46e5c') {
              throw new Error('Unexpected staging parent; review the live state again.');
            }
            const response = await github.rest.repos.getContent({owner, repo, path, ref: head});
            const file = response.data;
            if (file.type !== 'file' || file.encoding !== 'base64' || file.sha !== 'a6b08e0d95aad928b5f5229c05c8f17c572d7205') {
              throw new Error('Source integrity guard failed.');
            }
            const original = Buffer.from(file.content, 'base64').toString('utf8');
            const oldFunction = "internal fun sanitizeUntrustedResearchText(text: String, maxCharacters: Int): String {\n    require(maxCharacters >= 0)\n    val truncated = text.length > maxCharacters\n    val end = if (truncated && maxCharacters > 0 &&\n        Character.isHighSurrogate(text[maxCharacters - 1]) && Character.isLowSurrogate(text[maxCharacters])\n    ) maxCharacters - 1 else minOf(text.length, maxCharacters)\n    val sanitized = buildString {\n        text.substring(0, end).replace(\"<<<\", \"[quoted marker]\").codePoints().forEach { codePoint ->\n            when {\n                Character.isISOControl(codePoint) ||\n                    Character.getType(codePoint) == Character.FORMAT.toInt() ||\n                    Character.getType(codePoint) == Character.SURROGATE.toInt() -> {\n                    append(\"[U+\")\n                        .append(codePoint.toString(16).uppercase(Locale.ROOT).padStart(4, '0'))\n                        .append(']')\n                }\n                Character.getType(codePoint) == Character.LINE_SEPARATOR.toInt() ||\n                    Character.getType(codePoint) == Character.PARAGRAPH_SEPARATOR.toInt() -> append(' ')\n                codePoint == '<'.code -> append('\u2039')\n                codePoint == '>'.code -> append('\u203a')\n                else -> appendCodePoint(codePoint)\n            }\n        }\n    }.replace(Regex(\"(?i)\\\\b(system|developer|assistant|user)\\\\s*:\"), \"[quoted role]:\")\n    return if (truncated) \"$sanitized [TRUNCATED]\" else sanitized\n}\n";
            const newFunction = "internal fun sanitizeUntrustedResearchText(text: String, maxCharacters: Int): String =\n    BoundedResearchTextSanitizer.sanitize(text, maxCharacters)\n";
            if (original.split(oldFunction).length !== 2) throw new Error('Expected function must occur exactly once.');
            const updated = original.replace(oldFunction, newFunction);
            const blob = await github.rest.git.createBlob({owner, repo, content: updated, encoding: 'utf-8'});
            const tree = await github.rest.git.createTree({owner, repo, base_tree: parent.data.tree.sha,
              tree: [{path, mode: '100644', type: 'blob', sha: blob.data.sha}]});
            const commit = await github.rest.git.createCommit({owner, repo,
              message: 'fix(research): enforce bounded sanitizer output without replacing research engine',
              tree: tree.data.sha, parents: [head]});
            const recheck = await github.rest.repos.getBranch({owner, repo, branch});
            if (recheck.data.commit.sha !== head) throw new Error('Branch changed; refusing ref update.');
            await github.rest.git.updateRef({owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false});
            core.setOutput('patched_sha', commit.data.sha);
            await core.summary.addHeading('Owner-authorized PR17 surgical patch')
              .addRaw(`Branch: ${branch}

            Parent: ${head}

            Patched source commit: ${commit.data.sha}

            Only ResearchEngine.kt was changed by this step. No merge, credentials export or recursive jobs.
            `)
              .write();

  verify:
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact patched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.patch.outputs.patched_sha }}
          persist-credentials: false
      - name: Record exact tested source commit
        run: |
          test "$(git rev-parse HEAD)" = "${{ needs.patch.outputs.patched_sha }}"
          printf '%s\n' "${{ needs.patch.outputs.patched_sha }}" > verified-head.txt
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate backend syntax
        run: node --check backend/src/server.js
      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run real project unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload tested APK and source commit
        uses: actions/upload-artifact@v4
        with:
          name: DeviceAI-PR17-sanitizer-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            verified-head.txt
          if-no-files-found: error
      - name: Upload test reports and source commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PR17-sanitizer-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            verified-head.txt
          if-no-files-found: warn
