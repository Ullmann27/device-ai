name: "Code60 Command03 – scoped unsigned APK and regression QA"

# Deliberately isolated from protected original signing, releases and main.
# This workflow can only run for the approved work-in-progress PR branch.
on:
  push:
    branches:
      - fix/command03-native-controls-20261116
    paths:
      - .github/workflows/code60-command03-unsigned-qa.yml
      - app/**
      - tools/command03-native-qa/**
      - docs/research/omega/COMMAND03-REVIEW-FIX-HANDOFF-20261116.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code60-command03-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contract:
    if: github.repository == 'Ullmann27/device-ai' && github.ref == 'refs/heads/fix/command03-native-controls-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - name: Verify exact checked-out source and locked artwork
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          node tools/command03-native-qa/check-visual-source.mjs
          node --check app/src/main/assets/continuum-command03/native-bridge.js
      - name: Execute original DOM adapter tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/command03-dom" --ignore-scripts --no-audit --no-fund --no-save jsdom@26.1.0
          COMMAND03_DOM_MODULE="$RUNNER_TEMP/command03-dom/node_modules/jsdom/lib/api.js" \
            node --test --test-reporter=tap tools/command03-native-qa/native-bridge-behavior.test.mjs \
            | tee command03-dom.tap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Code60-Command03-DOM-evidence
          path: command03-dom.tap
          if-no-files-found: ignore
          retention-days: 7

  focused-android:
    if: github.repository == 'Ullmann27/device-ai' && github.ref == 'refs/heads/fix/command03-native-controls-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 36 and build tools 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile and execute the revised Command03 native cases
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gradle --no-daemon --no-build-cache --max-workers=1 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx2200m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:ActiveProcessorCount=2' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PdeviceAiMentorPreview=true -PcontinuumOwnerArm64=true \
            -PcontinuumStandaloneVersionCode=60 \
            -PcontinuumLocalStandaloneQa=true -PcontinuumUiWidgetTests=true \
            -I docs/evidence/omega-apk54-20261111/harness/test-memory.gradle \
            :app:testDebugUnitTest \
            --tests at.heinz.deviceai.ContinuumCommand03BridgeUiTest \
            --tests at.heinz.deviceai.ContinuumCommand03StageUiTest \
            --tests at.heinz.deviceai.ContinuumCommand03MediaStageUiTest \
            --tests at.heinz.deviceai.ui.Command03DraftLedgerTest
      - name: Upload native JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Code60-Command03-native-JUnit
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7

  unsigned-arm64:
    if: github.repository == 'Ullmann27/device-ai' && github.ref == 'refs/heads/fix/command03-native-controls-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android SDK and verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Assemble original-package Code60 unsigned for ARM64
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-build-cache --max-workers=1 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx2200m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:ActiveProcessorCount=2' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PdeviceAiMentorPreview=true -PcontinuumOwnerArm64=true \
            -PcontinuumStandaloneVersionCode=60 \
            -PcontinuumLocalRenderUnsigned=true :app:assembleRelease
      - name: Independently audit unsigned package and original artwork
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$apk"
          tools="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/35.0.0"
          "$tools/aapt2" dump badging "$apk" | tee /tmp/code60-badging.txt
          grep -Fq "package: name='at.heinz.deviceai.continuumlocal' versionCode='60' versionName='0.3.59'" /tmp/code60-badging.txt
          "$tools/zipalign" -c -P 16 -v 4 "$apk"
          if "$tools/apksigner" verify --verbose "$apk" >/dev/null 2>&1; then
            echo 'Unexpected signing: not a permitted unsigned diagnostic build' >&2
            exit 1
          fi
          node tools/command03-native-qa/check-visual-source.mjs
          python3 - "$apk" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              assert len(z.namelist()) == len(set(z.namelist()))
              assert any(p.endswith('continuum-command03/native-bridge.js') for p in z.namelist())
          PY
          printf 'source_sha=%s\npackage=at.heinz.deviceai.continuumlocal\nversionCode=60\nversionName=0.3.59\nstatus=UNSIGNED_NOT_INSTALLABLE\n' "$GITHUB_SHA" > BUILD-INFO.txt
          sha256sum "$apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload the actual unsigned APK and source-bound evidence
        uses: actions/upload-artifact@v4
        with:
          name: Code60-Command03-UNSIGNED-NOT-INSTALLABLE
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            BUILD-INFO.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
