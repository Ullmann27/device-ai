name: "Command03 – Bedienung und Layout prüfen"

# Deliberately isolated from protected original signing, releases and main.
# This workflow can only run for the approved work-in-progress PR branch.
on:
  push:
    branches:
      - fix/command03-native-controls-20261116
      - fix/command03-responsive-layout-20261117
      - feat/command03-hologram-settings-20261117
      - feat/continuum-cinema63-20261117
    paths:
      - .github/workflows/code60-command03-unsigned-qa.yml
      - app/**
      - tools/command03-native-qa/**
      - docs/research/omega/COMMAND03-REVIEW-FIX-HANDOFF-20261116.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code60-command03-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contract:
    if: github.repository == 'Ullmann27/device-ai' && contains(fromJSON('["refs/heads/fix/command03-native-controls-20261116","refs/heads/fix/command03-responsive-layout-20261117","refs/heads/feat/command03-hologram-settings-20261117","refs/heads/feat/continuum-cinema63-20261117"]'), github.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - name: Verify exact checked-out source and locked artwork
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          node tools/command03-native-qa/check-visual-source.mjs
          node --check app/src/main/assets/continuum-command03/native-bridge.js
      - name: Execute original DOM adapter tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/command03-dom" --ignore-scripts --no-audit --no-fund --no-save jsdom@26.1.0
          COMMAND03_DOM_MODULE="$RUNNER_TEMP/command03-dom/node_modules/jsdom/lib/api.js" \
            node --test --test-reporter=tap tools/command03-native-qa/native-bridge-behavior.test.mjs \
            | tee command03-dom.tap
      - name: Check rendered phone and fold layouts
        if: contains(fromJSON('["refs/heads/fix/command03-responsive-layout-20261117","refs/heads/feat/command03-hologram-settings-20261117","refs/heads/feat/continuum-cinema63-20261117"]'), github.ref)
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/command03-browser" --ignore-scripts --no-audit --no-fund --no-save playwright@1.62.1
          node "$RUNNER_TEMP/command03-browser/node_modules/playwright/cli.js" install --with-deps chromium
          if [ "$GITHUB_REF" = 'refs/heads/fix/command03-responsive-layout-20261117' ]; then
            git fetch --depth=1 origin 920a9f72f42490e3b496a0687406d999a39c7bf6
            git show FETCH_HEAD:app/src/main/assets/continuum-command03/native-layer.css > "$RUNNER_TEMP/command03-before.css"
            export COMMAND03_BASELINE_CSS="$RUNNER_TEMP/command03-before.css"
          fi
          COMMAND03_PLAYWRIGHT_MODULE="$RUNNER_TEMP/command03-browser/node_modules/playwright" \
            node tools/command03-native-qa/responsive-layout.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Command03-DOM-evidence
          path: |
            command03-dom.tap
            command03-layout-evidence/
          if-no-files-found: ignore
          retention-days: 7

  focused-android:
    if: github.repository == 'Ullmann27/device-ai' && contains(fromJSON('["refs/heads/fix/command03-native-controls-20261116","refs/heads/feat/command03-hologram-settings-20261117","refs/heads/feat/continuum-cinema63-20261117"]'), github.ref)
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 36 and build tools 35
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile and execute the revised Command03 native cases
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # The app deliberately allows only exact Gradle task names in local QA.
          # Use its existing fail-closed selection init script, not --tests flags.
          focused_args=()
          qa_version=60
          if [[ "$GITHUB_REF" == 'refs/heads/feat/command03-hologram-settings-20261117' || "$GITHUB_REF" == 'refs/heads/feat/continuum-cinema63-20261117' ]]; then
            qa_version=62
            if [ "$GITHUB_REF" = 'refs/heads/feat/continuum-cinema63-20261117' ]; then qa_version=63; fi
            python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          names = ['ContinuumCommand03BridgeUiTest.kt', 'ContinuumCommand03StageUiTest.kt',
                   'ContinuumSettingsHubUiTest.kt', 'ContinuumCommand03MediaStageUiTest.kt',
                   'Command03HostWebView.kt', 'CockpitHostFramePump.kt']
          paths = [Path('app/src/uiTest/java/at/heinz/deviceai') / name for name in names]
          paths.append(Path('app/src/test/java/at/heinz/deviceai/ui/Airbus2100CockpitOrchestratorTest.kt'))
          manifest = {'scope':'FOCUSED_HOST_TESTS_ONLY','source_commit':os.environ['GITHUB_SHA'],
                      'files':[{'path':str(p),'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in paths]}
          Path('command03-test-sources.json').write_text(json.dumps(manifest,indent=2)+'\n')
          selected = ['at.heinz.deviceai.ContinuumCommand03BridgeUiTest',
                      'at.heinz.deviceai.ContinuumCommand03MediaStageUiTest',
                      'at.heinz.deviceai.ContinuumCommand03StageUiTest',
                      'at.heinz.deviceai.ContinuumSettingsHubUiTest',
                      'at.heinz.deviceai.ui.Airbus2100CockpitOrchestratorTest']
          Path(os.environ['RUNNER_TEMP'],'command03-test-selection.json').write_text(json.dumps(selected))
          PY
            focused_args=(-Dcontinuum.native.testSources="$GITHUB_WORKSPACE/command03-test-sources.json"
              -Dcontinuum.native.compiledTestSources="$GITHUB_WORKSPACE/command03-compiled-test-sources.json"
              -I tools/command03-native-qa/focused-test-sources.init.gradle)
          else
            printf '%s\n' '["at.heinz.deviceai.ContinuumCommand03BridgeUiTest","at.heinz.deviceai.ContinuumCommand03StageUiTest","at.heinz.deviceai.ContinuumCommand03MediaStageUiTest","at.heinz.deviceai.ui.Command03DraftLedgerTest"]' \
              > "$RUNNER_TEMP/command03-test-selection.json"
          fi
          gradle --no-daemon --no-build-cache --max-workers=1 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx2200m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:ActiveProcessorCount=2' \
            -Dcontinuum.native.testSelection="$RUNNER_TEMP/command03-test-selection.json" \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PdeviceAiMentorPreview=true -PcontinuumOwnerArm64=true \
            -PcontinuumStandaloneVersionCode="$qa_version" \
            -PcontinuumLocalStandaloneQa=true -PcontinuumUiWidgetTests=true \
            -I docs/evidence/omega-apk54-20261111/harness/test-memory.gradle \
            -I tools/command03-native-qa/test-selection.init.gradle \
            "${focused_args[@]}" \
            :app:testDebugUnitTest
      - name: Upload native JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Command03-native-JUnit
          path: |
            app/build/test-results/testDebugUnitTest/
            command03-test-sources.json
            command03-compiled-test-sources.json
          if-no-files-found: ignore
          retention-days: 7

  unsigned-arm64:
    if: github.repository == 'Ullmann27/device-ai' && contains(fromJSON('["refs/heads/fix/command03-native-controls-20261116","refs/heads/feat/continuum-cinema63-20261117"]'), github.ref)
    env:
      APK_CODE: ${{ github.ref == 'refs/heads/feat/continuum-cinema63-20261117' && '63' || '60' }}
      APK_VERSION: ${{ github.ref == 'refs/heads/feat/continuum-cinema63-20261117' && '0.3.62' || '0.3.59' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Android SDK and verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code HEAD --
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Assemble original-package unsigned ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --no-build-cache --max-workers=1 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx2200m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:ActiveProcessorCount=2' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PdeviceAiMentorPreview=true -PcontinuumOwnerArm64=true \
            -PcontinuumStandaloneVersionCode="$APK_CODE" \
            -PcontinuumLocalRenderUnsigned=true :app:assembleRelease
      - name: Independently audit unsigned package and original artwork
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$apk"
          tools="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools/35.0.0"
          "$tools/aapt2" dump badging "$apk" | tee /tmp/code60-badging.txt
          grep -Fq "package: name='at.heinz.deviceai.continuumlocal' versionCode='$APK_CODE' versionName='$APK_VERSION'" /tmp/code60-badging.txt
          "$tools/zipalign" -c -P 16 -v 4 "$apk"
          if "$tools/apksigner" verify --verbose "$apk" >/dev/null 2>&1; then
            echo 'Unexpected signing: not a permitted unsigned diagnostic build' >&2
            exit 1
          fi
          node tools/command03-native-qa/check-visual-source.mjs
          python3 - "$apk" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              assert len(z.namelist()) == len(set(z.namelist()))
              assert any(p.endswith('continuum-command03/native-bridge.js') for p in z.namelist())
          PY
          printf 'source_sha=%s\npackage=at.heinz.deviceai.continuumlocal\nversionCode=%s\nversionName=%s\nstatus=UNSIGNED_NOT_INSTALLABLE\n' "$GITHUB_SHA" "$APK_CODE" "$APK_VERSION" > BUILD-INFO.txt
          sha256sum "$apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload the actual unsigned APK and source-bound evidence
        uses: actions/upload-artifact@v4
        with:
          name: Code${{ env.APK_CODE }}-Command03-UNSIGNED-NOT-INSTALLABLE
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            BUILD-INFO.txt
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

