name: "Code59 - integrated exact-source full QA and unsigned ARM64 APK"
run-name: ${{ github.ref_name == 'diagnostic/code59-native-lint-20261114' && 'DIAGNOSTIC ONLY - native runtime and full lint' || 'Code59 full source QA and ARM64' }}
on:
  push:
    branches:
      - release/code59-complete-qa-20261114
      - diagnostic/code59-native-lint-20261114
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code59-complete-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unsigned-arm64:
    if: github.repository == 'Ullmann27/device-ai' && github.ref == 'refs/heads/release/code59-complete-qa-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source and original package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test -f app/src/main/assets/cinema3d/monitor-rear-details.glb
          test -f tools/cockpit-workstation/build_monitor_rear.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - name: Install official Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Assemble Code59 from verified source without signing credentials
        shell: bash
        run: |
          set -euo pipefail
          unset CONTINUUM_LOCAL_SIGNING_FILE CONTINUUM_LOCAL_SIGNING_PASSWORD CONTINUUM_MENTOR_SIGNING_FILE CONTINUUM_MENTOR_SIGNING_PASSWORD
          gradle --no-daemon --no-build-cache --max-workers=1 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx2200m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:ActiveProcessorCount=2' \
            -Pkotlin.compiler.execution.strategy=in-process -PdeviceAiMentorPreview=true \
            -PcontinuumOwnerArm64=true -PcontinuumStandaloneVersionCode=59 \
            -PcontinuumLocalRenderUnsigned=true :app:assembleRelease
      - name: Check exact version, ARM64, alignment, signing status and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$apk"
          "$tools/aapt2" dump badging "$apk" > /tmp/code59-badging.txt
          grep -Fq "package: name='at.heinz.deviceai.continuumlocal' versionCode='59' versionName='0.3.58'" /tmp/code59-badging.txt
          grep -Fxq "native-code: 'arm64-v8a'" /tmp/code59-badging.txt
          grep -Eq "^(sdkVersion|minSdkVersion):'26'$" /tmp/code59-badging.txt
          grep -Fxq "targetSdkVersion:'36'" /tmp/code59-badging.txt
          if grep -q '^application-debuggable' /tmp/code59-badging.txt; then exit 1; fi
          "$tools/zipalign" -c -P 16 -v 4 "$apk" > /dev/null
          if "$tools/apksigner" verify "$apk" > /dev/null 2>&1; then
            echo "Refusing unexpectedly signed test artifact" >&2
            exit 1
          fi
          mkdir -p code59-evidence
          python3 -B - "$apk" <<'ELF'
          import importlib.util, json, os, pathlib, zipfile
          spec = importlib.util.spec_from_file_location('apk_validator', 'tools/code55-apk/validator.py')
          validator = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(validator)
          import sys
          with zipfile.ZipFile(sys.argv[1]) as archive:
              assert archive.testzip() is None, 'APK archive integrity'
              libraries = {n for n in archive.namelist() if n.startswith('lib/') and n.endswith('.so')}
              assert libraries == validator.EXPECTED_LIBRARIES, libraries
              results = [validator.check_elf(archive.read(n), n) for n in sorted(libraries)]
          pathlib.Path('code59-evidence/NATIVE-LIBRARIES.json').write_text(json.dumps({
              'source_sha': os.environ['GITHUB_SHA'], 'status': 'PASS', 'libraries': results}, indent=2) + '\n')
          print('CODE59_NATIVE_ELF_16K_PASS', len(results))
          ELF
          cp "$apk" code59-evidence/Continuum-Code59-UNSIGNED-NOT-INSTALLABLE.apk
          sha256sum code59-evidence/Continuum-Code59-UNSIGNED-NOT-INSTALLABLE.apk > code59-evidence/SHA256SUMS.txt
          printf 'source=%s\nsource_tree=%s\nversionCode=59\nversionName=0.3.58\npackage=at.heinz.deviceai.continuumlocal\nabi=arm64-v8a\nstatus=UNSIGNED_NOT_INSTALLABLE\nfold7_test=NOT_RUN\n' "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" > code59-evidence/BUILD-INFO.txt
      - name: Save verified unsigned APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Code59-UNSIGNED-NOT-INSTALLABLE
          path: code59-evidence/
          if-no-files-found: error
          retention-days: 14

  renderer-preflight:
    if: github.repository == 'Ullmann27/device-ai' && github.ref == 'refs/heads/release/code59-complete-qa-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Actual Android compilation, renderer and date regressions
        run: |
          set -euo pipefail
          unset CONTINUUM_LOCAL_SIGNING_FILE CONTINUUM_LOCAL_SIGNING_PASSWORD CONTINUUM_MENTOR_SIGNING_FILE CONTINUUM_MENTOR_SIGNING_PASSWORD
          gradle --no-daemon --no-build-cache --max-workers=1 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx2200m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:ActiveProcessorCount=2' \
            -Pkotlin.compiler.execution.strategy=in-process -PdeviceAiMentorPreview=true \
            -PcontinuumOwnerArm64=true -PcontinuumStandaloneVersionCode=59 \
            -PcontinuumLocalStandaloneQa=true -PcontinuumUiWidgetTests=true \
            -I docs/evidence/omega-apk54-20261111/harness/test-memory.gradle \
            -I .github/continuum/code56-renderer-tests.init.gradle \
            -I .github/continuum/code58-date-tail-tests.init.gradle :app:testDebugUnitTest
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          files = list(pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          cases = [c for f in files for c in ET.parse(f).getroot().iter('testcase')]
          assert cases, 'No actual JUnit results'
          assert not any(c.find(x) is not None for c in cases for x in ('failure', 'error', 'skipped'))
          repair = [c for c in cases if c.attrib.get('classname') == 'at.heinz.deviceai.avatar3d.CockpitMonitorPresentationTest']
          assert len(repair) == 6, f'Missing monitor regression cases: {len(repair)}'
          date_cases = [c for c in cases if c.attrib.get('classname') == 'at.heinz.deviceai.cognitive.ProactiveDateTailRegressionTest']
          assert len(date_cases) == 9, f'Missing date-tail regressions: {len(date_cases)}'
          print(f'CODE59_RENDERER_PREFLIGHT_PASS cases={len(cases)} repair_cases={len(repair)} date_cases={len(date_cases)}')
          PY
      - name: Preserve renderer JUnit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Code59-Renderer-regressions
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  full-android:
    if: github.repository == 'Ullmann27/device-ai' && (github.ref == 'refs/heads/release/code59-complete-qa-20261114' || github.ref == 'refs/heads/diagnostic/code59-native-lint-20261114')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Full unfiltered Android and UI regression suite (motion exercised without PNG export)
        if: github.ref == 'refs/heads/release/code59-complete-qa-20261114'
        env:
          CONTINUUM_BACKLOG_ROUNDTRIP_DIR: ${{ runner.temp }}/code59-backlog
          CONTINUUM_CONTRASTIVE_PARITY_DIR: ${{ runner.temp }}/code59-contrastive
          CONTINUUM_CRE1_PARITY_DIR: ${{ runner.temp }}/code59-cre1
        run: |
          set -euo pipefail
          mkdir -p app/build/reports
          node .github/continuum/backlog-fixtures.mjs roundtrip-prepare "$CONTINUUM_BACKLOG_ROUNDTRIP_DIR" | tee app/build/reports/code59-parity-prepare.log
          node .github/continuum/contrastive-parity.mjs prepare "$CONTINUUM_CONTRASTIVE_PARITY_DIR" | tee -a app/build/reports/code59-parity-prepare.log
          node .github/continuum/cre-parity.mjs prepare "$CONTINUUM_CRE1_PARITY_DIR" | tee -a app/build/reports/code59-parity-prepare.log
          unset CONTINUUM_LOCAL_SIGNING_FILE CONTINUUM_LOCAL_SIGNING_PASSWORD CONTINUUM_MENTOR_SIGNING_FILE CONTINUUM_MENTOR_SIGNING_PASSWORD
          gradle --no-daemon --no-build-cache --max-workers=1 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx2200m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:ActiveProcessorCount=2' \
            -Pkotlin.compiler.execution.strategy=in-process -PdeviceAiMentorPreview=true \
            -PcontinuumOwnerArm64=true -PcontinuumStandaloneVersionCode=59 \
            -PcontinuumLocalStandaloneQa=true -PcontinuumUiWidgetTests=true \
            -I docs/evidence/omega-apk54-20261111/harness/test-memory.gradle \
            :app:testDebugUnitTest
          node .github/continuum/backlog-fixtures.mjs roundtrip-verify "$CONTINUUM_BACKLOG_ROUNDTRIP_DIR" | tee app/build/reports/code59-parity-verify.log
          node .github/continuum/contrastive-parity.mjs verify "$CONTINUUM_CONTRASTIVE_PARITY_DIR" | tee -a app/build/reports/code59-parity-verify.log
          node .github/continuum/cre-parity.mjs verify "$CONTINUUM_CRE1_PARITY_DIR" | tee -a app/build/reports/code59-parity-verify.log
      - name: Diagnose actual snapshot and launch regressions
        if: github.ref == 'refs/heads/diagnostic/code59-native-lint-20261114'
        run: |
          set -euo pipefail
          unset CONTINUUM_LOCAL_SIGNING_FILE CONTINUUM_LOCAL_SIGNING_PASSWORD CONTINUUM_MENTOR_SIGNING_FILE CONTINUUM_MENTOR_SIGNING_PASSWORD
          gradle --no-daemon --no-build-cache --max-workers=1 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx2200m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:ActiveProcessorCount=2' \
            -Pkotlin.compiler.execution.strategy=in-process -PdeviceAiMentorPreview=true \
            -PcontinuumOwnerArm64=true -PcontinuumStandaloneVersionCode=59 \
            -PcontinuumLocalStandaloneQa=true -PcontinuumUiWidgetTests=true \
            -I docs/evidence/omega-apk54-20261111/harness/test-memory.gradle \
            -I .github/continuum/code59-targeted-tests.init.gradle :app:testDebugUnitTest
      - name: Require exact declared skip policy
        if: ${{ always() && github.ref == 'refs/heads/release/code59-complete-qa-20261114' }}
        run: python3 -B tools/code55-apk/junit-summary.py app/build/test-results/testDebugUnitTest --strict-skips
      - name: Require Code59 regression coverage
        if: ${{ always() && github.ref == 'refs/heads/release/code59-complete-qa-20261114' }}
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          xmls = pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')
          cases = [c for x in xmls for c in ET.parse(x).getroot().iter('testcase')]
          assert cases and not any(c.find(n) is not None for c in cases for n in ('failure','error'))
          names = {(c.get('classname','').split('.')[-1],c.get('name')) for c in cases if c.find('skipped') is None}
          required = {('Fold7RoutingRegressionTest','spokenSingularDownloadUsesApprovedComputerPlan'),
                      ('Fold7RoutingRegressionTest','informalJusticeResearchRemovesSpokenFillerWithoutLosingSubject'),
                      ('Fold7RoutingRegressionTest','funeralAndUnrelatedWebClaimsCannotBecomeJusticeEvidence'),
                      ('ResearchEngineTest','publicSearchRejectsUnrelatedFinalPageTitleAfterDiscovery'),
                      ('ResearchTopicAuthorityTest','counterEvidenceTemplatesCannotAdmitOffTopicSources'),
                      ('ResearchTopicAuthorityTest','followUpClaimTextCannotReplaceOriginalTopic'),
                      ('ResearchTopicAuthorityTest','titleGateUsesOriginatingSubquestion'),
                      ('ResearchTopicAuthorityTest','contradictionFollowUpKeepsItsMatchingSubquestion'),
                      ('ResearchTopicAuthorityTest','unrelatedContradictionsCannotInventCounterQueries'),
                      ('ResearchTopicAuthorityLengthTest','aLongRelevantClaimRetainsCounterResearch'),
                      ('ResearchTopicAuthorityLengthTest','aLongOriginalQuestionRetainsCounterResearch'),
                      ('ResearchTopicAuthorityLengthTest','aSingleQuestionStillRejectsOffTopicContradictions'),
                      ('LocalPoliteFollowUpTest','politeFollowUpFramesCorrectionsInOriginalOrder'),
                      ('LocalPoliteFollowUpTest','stretchedContinuationVariantsKeepConversationContext'),
                      ('LocalPoliteFollowUpTest','stretchedContinuationRetainsOriginalRequestAndCorrections'),
                      ('LocalPoliteFollowUpTest','repetitionDoesNotTurnOtherWordsOrActionsIntoContinuation'),
                      ('GazeBlinkPolicyTest','animationClockWrapAdmitsFreshGazeBlinks'),
                      ('ContinuumLiveProjectionServiceUiTest','geometryResetDetachFailureEndsCapture'),
                      ('ContinuumLiveProjectionServiceUiTest','geometryResetAttachFailureEndsCapture'),
                      ('ContinuumLiveProjectionServiceUiTest','successfulGeometryResetKeepsCaptureAndRejectsOldReader')}
          required |= {('OwnerObjectScopeCorrectionTest','laterRetractionNeverBecomesAnObjectCorrection'),
                       ('OwnerObjectScopeCorrectionTest','literalWhiteRemainsAValidColorCorrection'),
                       ('AvatarFramePacingTest','budgetStaysBoundedAcrossRefreshRates'),
                       ('ContinuumHologramMotionUiTest','lateVsyncCannotRewindNewerAudioSamples'),
                       ('ContinuumLiveProjectionServiceUiTest','staleStartCannotStopRunningReplacement'),
                       ('LiveActionCancellationBoundaryTest','cancellationAfterAdmissionAllowsOnlyFreshRetry'),
                       ('LiveActionCancellationBoundaryTest','cancellationAfterDispatchStillForbidsFreshRetry'),
                       ('ProactiveMemoryDateTest','explicitYearMustMatchToday'),
                       ('ProactiveMemoryDateTest','explicitClockTailDoesNotBecomeAShortYear')}
          required |= {('ContinuumProjectionCommandIsolationUiTest','staleStartCannotStopAlreadyBoundCapture'),
                       ('ContinuumProjectionCommandIsolationUiTest','nullStartCannotStopAlreadyBoundCapture'),
                       ('ContinuumProjectionCommandIsolationUiTest','duplicateStartCannotRepromoteOrReuseConsent'),
                       ('ContinuumProjectionCommandIsolationUiTest','staleStopStillCannotStopAlreadyBoundCapture'),
                       ('ContinuumProjectionCommandIsolationUiTest','matchingStopStillEndsAlreadyBoundCapture'),
                       ('ContinuumLiveProjectionServiceUiTest','nullStartCannotStopRunningCapture'),
                       ('ContinuumLiveProjectionServiceUiTest','supersededQueuedStartKeepsReplacementCaptureBinding'),
                       ('ContinuumLiveProjectionServiceUiTest','disconnectedObservationRejectsQueuedStartAfterPromotion'),
                       ('ContinuumLiveProjectionServiceUiTest','promotionFailureClosesAndUsesItsStartId'),
                       ('ContinuumLiveProjectionServiceUiTest','projectionCallbackRevocationEndsSessionAndForeground'),
                       ('LocalShortClarificationTest','shortClarificationsRequireTheirConversation'),
                       ('LocalShortClarificationTest','namedQuestionsQuotesAndCommandsRemainIndependent'),
                       ('LocalShortClarificationTest','clarificationNeverAuthorizesContinuationOrDeviceActions')}
          required.add(('LocalPoliteFollowUpTest','stretchedContinuationAssemblesPromptAndClearsSession'))
          required |= {('ProactiveDateTailRegressionTest', name) for name in (
              'dottedClockValuesPreserveToday',
              'quantitiesStaySeparateFromTheYear',
              'invalidClocksAndIdentifiersDoNotBecomeQuantities',
              'explicitYearAndCalendarDayRemainAuthoritative',
              'trustAndRelativeFreshnessAreNotRelaxed',
              'correctedDateStillRespectsAnnouncementCooldown',
              'shortYearsWithProseAreNotCounts',
              'clockUnitsCannotHideInvalidTails',
              'countUnitsCannotHideIdentifiers'
          )}
          required |= {('OwnerAppActionWorkSceneUiTest', name) for name in (
              'approvedSplitScreenLaunchStartsComputerWithoutRefocusingCockpit',
              'approvedLaunchDoesNotStartComputerAfterCockpitStops',
              'approvedFullscreenLaunchWaitsForCockpitReturn',
              'ownerStopDuringSplitScreenLaunchRejectsLateCallback',
              'failedSplitScreenLaunchCannotRequestComputerConsent'
          )}
          required |= {('OwnerComputerIntentParserTest', name) for name in (
              'messageDestinationPrepositionsDoNotBecomeRecipientText',
              'perAndViaPreserveDraftBodyAndSeparateSendApproval',
              'destinationPrepositionsCannotBypassNegationOrAmbiguity'
          )}
          required.add(('OwnerComputerTaskGrantTest','parsedDestinationKeepsExistingDraftAndSendProtected'))
          required |= {('ContinuumUiSnapshotUiTest', name) for name in (
              'successfulSavePublishesClosedPngAndJson',
              'nullImageStreamRemovesPendingRow',
              'imageAccessDenialLeavesNoPendingRow',
              'failedPngEncodingRemovesPendingRow',
              'imageStreamCloseFailureRemovesPendingRow',
              'nullMetadataStreamRemovesBothRows',
              'metadataWriteFailureRemovesBothRows',
              'publishFailureRemovesBothRows',
              'rollbackFailurePreservesCauseAndAttemptsOtherRow',
              'unavailableOptionalMetadataKeepsValidImage',
              'oldAndroidDoesNotCreateRows'
          )}
          required |= {('ContinuumContrastiveParityTest','actualNodeKotlinNodeTrainingParity'),
                       ('ContinuumContrastiveParityTest','actualNodeKotlinNodeSwb2TrainingParityAfter350Rounds'),
                       ('Cre1InferenceEncoderTest','trainedNodeCheckpointMatchesKotlinFeaturesAndScores'),
                       ('DevelopmentBacklogRoundtripTest','kotlinChangesNodeWrittenBacklogWithTheSharedRules')}
          assert required <= names, f'Missing regression cases: {required - names}'
          print(f'CODE59_REQUIRED_REGRESSIONS_PASS={len(required)}')
          PY
      - name: Full Android lint
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          gradle --no-daemon --no-build-cache --max-workers=1 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx2200m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:ActiveProcessorCount=2' \
            -Pkotlin.compiler.execution.strategy=in-process -PdeviceAiMentorPreview=true \
            -PcontinuumOwnerArm64=true -PcontinuumStandaloneVersionCode=59 \
            -PcontinuumLocalStandaloneQa=true -PcontinuumUiWidgetTests=true \
            -I .github/continuum/full-lint.init.gradle :app:lintDebug
      - name: Preserve real test and lint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Code59-Android-full-QA
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
            app/build/reports/code59-parity-*.log
          if-no-files-found: warn
          retention-days: 14

  node-backend:
    if: github.repository == 'Ullmann27/device-ai' && github.ref == 'refs/heads/release/code59-complete-qa-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - name: Full Node QA and critical contracts
        run: |
          set -euo pipefail
          node scripts/continuum-reliability-qa.mjs critical --out "$RUNNER_TEMP/code59-critical"
          node scripts/continuum-reliability-qa.mjs full-node --out "$RUNNER_TEMP/code59-full"
      - name: Backend checks
        run: |
          set -euo pipefail
          npm --prefix backend ci --ignore-scripts --no-audit --no-fund
          npm --prefix backend run check
          npm --prefix backend test
      - name: Preserve exact Node QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Code59-Node-backend-QA
          path: |
            ${{ runner.temp }}/code59-critical/
            ${{ runner.temp }}/code59-full/
          if-no-files-found: warn
          retention-days: 14

  native-runtime:
    if: github.repository == 'Ullmann27/device-ai' && (github.ref == 'refs/heads/release/code59-complete-qa-20261114' || github.ref == 'refs/heads/diagnostic/code59-native-lint-20261114')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze native probe source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - name: Install official native Android runtime
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/continuum-native-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'ANDROID_USER_HOME=%s\n' "$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          printf 'ANDROID_AVD_HOME=%s\n' "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name continuum-native-pdf --package 'system-images;android-35;google_apis;x86_64' \
            --device pixel_7 --path "$ANDROID_AVD_HOME/continuum-native-pdf.avd"
          test -s "$ANDROID_AVD_HOME/continuum-native-pdf.ini"
          test "$("$ANDROID_HOME/emulator/emulator" -list-avds | tr -d '\r')" = continuum-native-pdf
      - name: Build disposable native test APKs
        shell: bash
        run: |
          set -euo pipefail
          unset CONTINUUM_LOCAL_SIGNING_FILE CONTINUUM_LOCAL_SIGNING_PASSWORD CONTINUUM_MENTOR_SIGNING_FILE CONTINUUM_MENTOR_SIGNING_PASSWORD
          gradle --no-daemon --no-build-cache --max-workers=1 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx2200m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:ActiveProcessorCount=2' \
            -Pkotlin.compiler.execution.strategy=in-process -PdeviceAiMentorPreview=true \
            :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify native PDF, Filament and real app lifecycle
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/code59-native-pdf"
          mkdir -p "$evidence"
          : "${ANDROID_USER_HOME:?Native user directory missing}"
          : "${ANDROID_AVD_HOME:?Native AVD directory missing}"
          test -s "$ANDROID_AVD_HOME/continuum-native-pdf.ini"
          test -s "$ANDROID_AVD_HOME/continuum-native-pdf.avd/config.ini"
          test -c /dev/kvm
          original_kvm_group="$(stat -c '%g' /dev/kvm)"
          original_kvm_mode="$(stat -c '%a' /dev/kvm)"
          emulator_pid=''
          cleanup() {
            native_exit=$?
            if (( native_exit != 0 )) && [[ -f "$evidence/emulator.log" ]]; then
              cat "$evidence/emulator.log" || true
            fi
            if [[ -n "$emulator_pid" ]]; then
              timeout 10 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true
              kill "$emulator_pid" 2>/dev/null || true
            fi
            sudo chgrp "$original_kvm_group" /dev/kvm
            sudo chmod "$original_kvm_mode" /dev/kvm
            return "$native_exit"
          }
          trap cleanup EXIT
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -no-window -version > "$evidence/emulator-version.txt"
          "$ANDROID_HOME/platform-tools/adb" start-server
          "$ANDROID_HOME/emulator/emulator" -avd continuum-native-pdf -port 5554 -accel on \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swangle -memory 2048 -cores 2 \
            > "$evidence/emulator.log" 2>&1 &
          emulator_pid=$!
          ready=false
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            kill -0 "$emulator_pid"
            if [[ "$(timeout 10 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell -n getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == 1 ]]; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          timeout 300 bash tools/code55-apk/native-pdf-emulator.sh emulator-5554 "$evidence"
          timeout 300 bash tools/code55-apk/native-filament-emulator.sh emulator-5554 "$evidence/filament"
          # Bound 26 capped UI captures.
          timeout 1500 bash tools/code55-apk/native-app-smoke.sh emulator-5554 "$evidence/app"
      - name: Preserve native proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Code59-native-runtime-QA
          path: ${{ runner.temp }}/code59-native-pdf/
          retention-days: 14
          if-no-files-found: warn
