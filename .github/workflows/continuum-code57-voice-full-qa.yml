      - name: Verify source identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - name: Full Node QA and critical contracts
        run: |
          set -euo pipefail
          node scripts/continuum-reliability-qa.mjs critical --out "$RUNNER_TEMP/code59-critical"
          node scripts/continuum-reliability-qa.mjs full-node --out "$RUNNER_TEMP/code59-full"
      - name: Backend checks
        run: |
          set -euo pipefail
          npm --prefix backend ci --ignore-scripts --no-audit --no-fund
          npm --prefix backend run check
          npm --prefix backend test
      - name: Preserve exact Node QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Code59-Node-backend-QA
          path: |
            ${{ runner.temp }}/code59-critical/
            ${{ runner.temp }}/code59-full/
          if-no-files-found: warn
          retention-days: 14

  native-runtime:
    if: github.repository == 'Ullmann27/device-ai' && (github.ref == 'refs/heads/release/code59-complete-qa-20261114' || github.ref == 'refs/heads/diagnostic/code59-native-lint-20261114')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze native probe source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - name: Install official native Android runtime
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
          emulator_archive="$RUNNER_TEMP/code59-emulator-37.1.11.zip"
          emulator_root="$RUNNER_TEMP/code59-emulator-37.1.11"
          emulator_evidence="$RUNNER_TEMP/code59-native-pdf"
          mkdir -p "$emulator_root" "$emulator_evidence"
          printf '%s\n' \
            'version=37.1.11' \
            'build=15917651' \
            'url=https://dl.google.com/android/repository/emulator-linux_x64-15917651.zip' \
            'sha256=95771e0ae431897b2a4bd2d97fa095f29a8b0624a7b216baf529f9306161c266' \
            'pin_source=https://github.com/dotnet/android/blob/e766c8d60ad90114094fc053b978a40f3431306f/Configuration.props' \
            'regression_source=https://chromium.googlesource.com/chromium/src/tools/android/+/0d2c7590ad90c5e3e5390a1d732ef2b2305d343d' \
            > "$emulator_evidence/emulator-pin.txt"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            --proto '=https' --proto-redir '=https' \
            'https://dl.google.com/android/repository/emulator-linux_x64-15917651.zip' \
            --output "$emulator_archive"
          printf '%s  %s\n' '95771e0ae431897b2a4bd2d97fa095f29a8b0624a7b216baf529f9306161c266' \
            "$emulator_archive" | sha256sum --check --strict
          sha256sum "$emulator_archive" > "$emulator_evidence/emulator-archive-sha256.txt"
          unzip -q "$emulator_archive" -d "$emulator_root"
          test -x "$emulator_root/emulator/emulator"
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*37\.1\.11[[:space:]]*$' \
            "$emulator_root/emulator/source.properties"
          export CODE59_EMULATOR_BIN="$emulator_root/emulator/emulator"
          "$CODE59_EMULATOR_BIN" -no-window -version > "$emulator_evidence/emulator-pin-version.txt" 2>&1
          grep -Eq 'Android emulator version 37\.1\.11(\.0)? \(build_id 15917651\)' \
            "$emulator_evidence/emulator-pin-version.txt"
          printf 'CODE59_EMULATOR_BIN=%s\n' "$CODE59_EMULATOR_BIN" >> "$GITHUB_ENV"
          export ANDROID_USER_HOME="$RUNNER_TEMP/continuum-native-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'ANDROID_USER_HOME=%s\n' "$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          printf 'ANDROID_AVD_HOME=%s\n' "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name continuum-native-pdf --package 'system-images;android-35;google_apis;x86_64' \
            --device pixel_7 --path "$ANDROID_AVD_HOME/continuum-native-pdf.avd"
          test -s "$ANDROID_AVD_HOME/continuum-native-pdf.ini"
          test "$("$CODE59_EMULATOR_BIN" -list-avds | tr -d '\r')" = continuum-native-pdf
      - name: Verify surface evidence validator
        run: python3 -B -m unittest discover -s tools/code55-apk -p test_native_hologram_evidence.py -v
      - name: Build disposable native test APKs
        shell: bash
        run: |
          set -euo pipefail
          unset CONTINUUM_LOCAL_SIGNING_FILE CONTINUUM_LOCAL_SIGNING_PASSWORD CONTINUUM_MENTOR_SIGNING_FILE CONTINUUM_MENTOR_SIGNING_PASSWORD
          gradle --no-daemon --no-build-cache --max-workers=1 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx2200m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:ActiveProcessorCount=2' \
            -Pkotlin.compiler.execution.strategy=in-process -PdeviceAiMentorPreview=true \
            :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify native PDF, Filament and real app lifecycle
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/code59-native-pdf"
          mkdir -p "$evidence"
          : "${ANDROID_USER_HOME:?Native user directory missing}"
          : "${ANDROID_AVD_HOME:?Native AVD directory missing}"
          test -s "$ANDROID_AVD_HOME/continuum-native-pdf.ini"
          test -s "$ANDROID_AVD_HOME/continuum-native-pdf.avd/config.ini"
          test -c /dev/kvm
          host_crash="$evidence/host-crash"
          mkdir "$host_crash"
          crash_database="$host_crash/database"
          mkdir "$crash_database"
          crashreport_bin="$(dirname "$CODE59_EMULATOR_BIN")/crashreport"
          test -x "$crashreport_bin"
          printf '%s  %s\n' '4bd4cfe83403c82ab618163f4311bf4aa2418d7c64029133f2627e50e4f65008' "$crashreport_bin" \
            | sha256sum --check --strict > "$host_crash/tool-sha256-check.txt"
          sha256sum "$crashreport_bin" > "$host_crash/tool-sha256.txt"
          if timeout 10 "$crashreport_bin" -h > "$host_crash/tool-help.txt" 2>&1; then
            printf '0\n' > "$host_crash/tool-help-exit.txt"
          else
            tool_exit=$?
            printf '%s\n' "$tool_exit" > "$host_crash/tool-help-exit.txt"
            exit "$tool_exit"
          fi
          cat /proc/sys/kernel/core_pattern > "$host_crash/core-pattern.txt"
          ulimit -c > "$host_crash/core-limit.txt"
          original_kvm_group="$(stat -c '%g' /dev/kvm)"
          original_kvm_mode="$(stat -c '%a' /dev/kvm)"
          emulator_pid=''
          cleanup() {
            native_exit=$?
            if (( native_exit != 0 )) && [[ -f "$evidence/emulator.log" ]]; then
              cat "$evidence/emulator.log" || true
              python3 - "$host_crash" "$crashreport_bin" "$emulator_pid" "$native_exit" <<'PY' || true
          import datetime, hashlib, json, os, pathlib, re, shutil, subprocess, sys
          directory = pathlib.Path(sys.argv[1])
          database = (directory / 'database').resolve()
          report = {'emulator_pid': sys.argv[3], 'native_exit': int(sys.argv[4]),
                    'scope': 'OWN_EMULATOR_CRASHPAD_ONLY', 'dumps': []}
          try:
              for dump in sorted(database.rglob('*.dmp')):
                  if dump.is_symlink() or not dump.is_file() or not dump.resolve().is_relative_to(database):
                      raise ValueError('Unexpected crash dump path')
                  with dump.open('rb') as stream:
                      digest = hashlib.file_digest(stream, 'sha256').hexdigest()
                  item = {'file': str(dump.relative_to(directory)), 'bytes': dump.stat().st_size,
                          'sha256': digest}
                  report['dumps'].append(item)
                  try:
                      result = subprocess.run([sys.argv[2], '-d', str(dump)],
                          capture_output=True, text=True, errors='replace', timeout=30)
                      item['processor_exit'] = result.returncode
                      stack = result.stdout.partition('Module annotations:')[0]
                      (directory / (dump.stem + '-stack.txt')).write_text(stack)
                      (directory / (dump.stem + '-processor-stderr.txt')).write_text(result.stderr)
                      item['annotations_omitted_from_stack'] = 'Module annotations:' in result.stdout
                  except Exception as error:
                      item['processor_error'] = str(error)
              report['collection_status'] = 'CAPTURED' if report['dumps'] else 'NO_DUMP'
          except Exception as error:
              report['collection_status'] = 'FAILED'
              report['collection_error'] = str(error)
          systemd = {'status': 'NOT_NEEDED', 'commands': []}
          report['systemd'] = systemd
          if not report['dumps']:
              systemd['status'] = 'NO_CORE'
              def run_command(label, argv, seconds):
                  item = {'name': label, 'argv': argv}
                  systemd['commands'].append(item)
                  try:
                      with (directory / (label + '-stdout.txt')).open('w') as output, \
                           (directory / (label + '-stderr.txt')).open('w') as error:
                          result = subprocess.run(argv, stdout=output, stderr=error, timeout=seconds)
                      item['exit'] = result.returncode
                      return result.returncode
                  except Exception as error:
                      item['error'] = str(error)
                      return None
              try:
                  ctl, debugger = shutil.which('coredumpctl'), shutil.which('gdb')
                  systemd['tools'] = {'coredumpctl': ctl, 'gdb': debugger}
                  if ctl:
                      run_command('systemd-tool-version', [ctl, '--version'], 10)
                  if debugger:
                      run_command('systemd-debugger-version', [debugger, '--version'], 10)
                  pid = (directory / 'emulator-pid.txt').read_text().strip()
                  uid = (directory / 'emulator-uid.txt').read_text().strip()
                  launch = (directory / 'emulator-launch-utc.txt').read_text().strip()
                  datetime.datetime.strptime(launch, '%Y-%m-%d %H:%M:%S UTC')
                  executable = pathlib.Path((directory / 'emulator-executable.txt').read_text().strip())
                  assert re.fullmatch('[1-9][0-9]*', pid) and pid == sys.argv[3]
                  assert uid == str(os.getuid()) and executable.is_absolute()
                  assert executable.resolve().is_relative_to(pathlib.Path(sys.argv[2]).resolve().parent / 'qemu')
                  matches = ['COREDUMP_PID=' + pid, 'COREDUMP_UID=' + uid, 'COREDUMP_EXE=' + str(executable)]
                  systemd['matches'], systemd['since_utc'] = matches, launch
                  if ctl is None:
                      systemd['reason'] = 'coredumpctl unavailable'
                  else:
                      prefix = [] if os.geteuid() == 0 else ['sudo', '-n']
                      base = [ctl, '--no-pager', '--since=' + launch]
                      if run_command('systemd-info', prefix + base + ['info'] + matches, 30) == 0:
                          systemd['status'] = 'CORE_INFO_CAPTURED'
                          if debugger is None:
                              systemd['reason'] = 'gdb unavailable; metadata retained'
                          else:
                              arguments = "-nx -q -batch -iex 'set auto-load off' " \
                                  "-iex 'set debuginfod enabled off' -iex 'set print frame-arguments none' " \
                                  "-iex 'set print entry-values no' -ex 'thread apply all bt 64'"
                              timeout = shutil.which('timeout')
                              assert timeout, 'GNU timeout unavailable'
                              systemd['tools']['timeout'] = timeout
                              systemd['debug_deadline_seconds'] = 45
                              command = prefix + [timeout, '--signal=TERM', '--kill-after=2s', '43s'] + base
                              code = run_command('systemd-debug', command + ['--debugger=' + debugger,
                                  '--debugger-arguments=' + arguments, 'debug'] + matches, None)
                              output = (directory / 'systemd-debug-stdout.txt').read_text(errors='replace')
                              systemd['debug_has_frames'] = bool(re.search(r'^\s*#\d+\s', output, re.M))
                              if code == 0 and systemd['debug_has_frames']:
                                  systemd['status'] = 'STACK_CAPTURED'
                      else:
                          systemd['reason'] = 'matching core metadata not retrieved; inspect command status'
              except Exception as error:
                  systemd['error'] = str(error)
          (directory / 'COLLECTION.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
            fi
            if [[ -n "$emulator_pid" ]]; then
              timeout 10 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true
              kill "$emulator_pid" 2>/dev/null || true
            fi
            sudo chgrp "$original_kvm_group" /dev/kvm
            sudo chmod "$original_kvm_mode" /dev/kvm
            return "$native_exit"
          }
          trap cleanup EXIT
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          "$CODE59_EMULATOR_BIN" -no-window -version > "$evidence/emulator-version.txt"
          if timeout 30 "$CODE59_EMULATOR_BIN" -no-window -help-gpu > "$evidence/emulator-gpu-help.txt" 2>&1; then
            printf '0\n' > "$evidence/emulator-gpu-help-exit.txt"
          else
            printf '%s\n' "$?" > "$evidence/emulator-gpu-help-exit.txt"
          fi
          "$ANDROID_HOME/platform-tools/adb" start-server
          id -u > "$host_crash/emulator-uid.txt"
          date -u '+%Y-%m-%d %H:%M:%S UTC' > "$host_crash/emulator-launch-utc.txt"
          ANDROID_EMU_CRASH_REPORTING_DATABASE="$crash_database" \
          "$CODE59_EMULATOR_BIN" -avd continuum-native-pdf -port 5554 -accel on \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -memory 2048 -cores 2 \
            > "$evidence/emulator.log" 2>&1 &
          emulator_pid=$!
          printf '%s\n' "$emulator_pid" > "$host_crash/emulator-pid.txt"
          ready=false
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            kill -0 "$emulator_pid"
            if [[ "$(timeout 10 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell -n getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == 1 ]]; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          readlink "/proc/$emulator_pid/exe" > "$host_crash/emulator-executable.txt"
          cat "/proc/$emulator_pid/maps" > "$host_crash/emulator-maps.txt"
          python3 - "$evidence/emulator.log" "$crash_database" "$emulator_pid" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text()
          reports = re.findall(r'Storing crashdata in: (.*?), detection is (\w+) for process: (\d+)', log)
          assert reports == [(sys.argv[2], 'enabled', sys.argv[3])], reports
          assert 'Crash reports will be automatically uploaded' not in log
          assert 'gles_mode_selected:swiftshader' in log, 'Requested backend not selected'
          adapters = [line for line in log.splitlines() if 'Graphics Adapter ' in line and 'Graphics Adapter Vendor ' not in line]
          assert len(adapters) == 1 and 'SwiftShader' in adapters[0] and 'ANGLE (' not in adapters[0], adapters
          print('DIRECT_SWIFTSHADER_BACKEND_CONFIRMED')
          PY
          timeout 300 bash tools/code55-apk/native-pdf-emulator.sh emulator-5554 "$evidence"
          timeout 300 bash tools/code55-apk/native-filament-emulator.sh emulator-5554 "$evidence/filament"
          timeout 300 bash tools/code55-apk/native-hologram-emulator.sh emulator-5554 "$evidence/hologram"
          # Bound 26 capped UI captures.
          timeout 1500 bash tools/code55-apk/native-app-smoke.sh emulator-5554 "$evidence/app"
      - name: Preserve native proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Code59-native-runtime-QA
          path: ${{ runner.temp }}/code59-native-pdf/
          retention-days: 14
          if-no-files-found: warn
