name: Continuum UI screenshots (emulator, research)

# Real Android build checks and screenshots of the start screen for the UI acceptance of PR #79/#80 and successors.
# Runs only for opus/continuum-aaa-ui-* branches or on demand. Builds the integration candidate as the feature preview
# (-PdeviceAiFeaturePreview=true: package at.heinz.deviceai.featurepreview, versionCode 9, its own data; debug key,
# never the owner's main app), installs it only on a throw-away emulator, checks that every tap opens its target and
# publishes screenshots, UI dumps and a build report to opus/continuum-ui-evidence-20261022 and as an artifact.

on:
  push:
    branches: [ "opus/continuum-aaa-ui-*" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: continuum-ui-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SDK: /usr/local/lib/android/sdk
      EVIDENCE: ${{ github.workspace }}/../ui-evidence
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python UI tool tests (design diff, tap targets)
        id: python
        continue-on-error: true
        run: |
          mkdir -p "$EVIDENCE"
          pip install --quiet numpy pillow
          python3 -m unittest discover -s scripts -p 'test_continuum_*.py' 2>&1 | tee "$EVIDENCE/python-ui-tests.txt"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Node UI regression tests
        id: node
        continue-on-error: true
        run: |
          mkdir -p "$EVIDENCE"
          node --test .github/continuum/learning-wave-animation.test.mjs .github/continuum/aaa-cockpit-and-effects.test.mjs \
            .github/continuum/android-holographic-home.test.mjs 2>&1 | tee "$EVIDENCE/node-ui-tests.txt"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Android SDK packages
        run: |
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" \
            "system-images;android-35;google_apis;x86_64" >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: JVM unit tests
        id: unit
        continue-on-error: true
        run: gradle :app:testDebugUnitTest -PdeviceAiFeaturePreview=true --stacktrace

      - name: Android lint
        id: lint
        continue-on-error: true
        run: gradle :app:lintDebug -PdeviceAiFeaturePreview=true --stacktrace

      - name: Debug APK
        id: apk
        run: gradle :app:assembleDebug -PdeviceAiFeaturePreview=true --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator screenshots and tap test
        id: shots
        continue-on-error: true
        run: |
          export ADB=$SDK/platform-tools/adb
          echo no | $SDK/cmdline-tools/latest/bin/avdmanager create avd -n continuum \
            -k "system-images;android-35;google_apis;x86_64" -d pixel_7 --force
          nohup $SDK/emulator/emulator -avd continuum -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect \
            -no-snapshot -memory 4096 > "$EVIDENCE/emulator-boot.txt" 2>&1 &
          $ADB wait-for-device
          for i in $(seq 1 150); do
            [ "$($ADB shell getprop sys.boot_completed | tr -d '\r')" = "1" ] && break
            sleep 4
          done
          $ADB shell settings put global window_animation_scale 0
          $ADB shell settings put global transition_animation_scale 0
          # Deterministic still frames (the hologram honours the system animator setting); the script re-enables
          # animation for one extra screenshot at the end.
          $ADB shell settings put global animator_duration_scale 0
          python3 scripts/continuum-emulator-screenshots.py app/build/outputs/apk/debug/app-debug.apk "$EVIDENCE/shots" \
            at.heinz.deviceai.featurepreview at.heinz.deviceai.AgentActivity

      - name: Build report
        if: always()
        run: |
          mkdir -p "$EVIDENCE"
          APK=app/build/outputs/apk/debug/app-debug.apk
          {
            echo "commit: $GITHUB_SHA"
            echo "ref: $GITHUB_REF"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "python-ui-tests: ${{ steps.python.outcome }}"
            echo "node-ui-tests: ${{ steps.node.outcome }}"
            echo "unit-tests: ${{ steps.unit.outcome }}"
            echo "lint: ${{ steps.lint.outcome }}"
            echo "assembleDebug: ${{ steps.apk.outcome }}"
            echo "emulator-screenshots-and-tap-targets: ${{ steps.shots.outcome }}"
            python3 -c "import json; r=json.load(open('$EVIDENCE/shots/report.json')); print('tap-targets:', r.get('tapSummary'), 'installed:', r.get('installed'))" 2>/dev/null || echo "tap-targets: no report"
            if [ -f "$APK" ]; then
              echo "apk-sha256: $(sha256sum "$APK" | cut -c1-64)"
              echo "apk-bytes: $(stat -c %s "$APK")"
              $SDK/build-tools/35.0.0/aapt dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|launchable-activity)"
              # the candidate must be the feature preview, never the main package
              if $SDK/build-tools/35.0.0/aapt dump badging "$APK" | grep -q "^package: name='at.heinz.deviceai.featurepreview' versionCode='9'"; then
                echo "variant-check: OK (at.heinz.deviceai.featurepreview, versionCode 9)"
              else
                echo "variant-check: FAIL (not the feature-preview package)"
              fi
              $SDK/build-tools/35.0.0/apksigner verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
            fi
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = {k: 0 for k in ("tests", "failures", "errors", "skipped")}
          for p in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              r = ET.parse(p).getroot()
              for k in t: t[k] += int(r.get(k, "0"))
          print("jvm-unit-tests:", t)
          PY
            ls app/build/reports/lint-results-debug.txt >/dev/null 2>&1 && tail -n 3 app/build/reports/lint-results-debug.txt
          } > "$EVIDENCE/build-report.txt" 2>&1
          cp app/build/reports/lint-results-debug.txt "$EVIDENCE/" 2>/dev/null || true
          cat "$EVIDENCE/build-report.txt"

      - name: Shrink tap screenshots
        if: always()
        run: |
          command -v convert >/dev/null || { echo "ImageMagick not installed: tap screenshots stay PNG"; exit 0; }
          for f in "$EVIDENCE"/shots/*-tap*.png; do
            [ -f "$f" ] || continue
            convert "$f" -resize 45% -quality 82 "${f%.png}.jpg" && rm "$f"
          done

      - name: Publish evidence branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BR=opus/continuum-ui-evidence-20261022
          DEST="runs/$GITHUB_RUN_ID-${GITHUB_SHA::8}"
          W="$RUNNER_TEMP/evidence-repo"
          mkdir -p "$W" && cd "$W"
          git init -q
          git config user.name "continuum-ui-screenshots"
          git config user.email "actions@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git fetch -q origin "$BR" 2>/dev/null; then git checkout -q -B "$BR" FETCH_HEAD; else git checkout -q --orphan "$BR"; fi
            mkdir -p "$DEST" && cp -r "$EVIDENCE"/. "$DEST"/
            git add -A
            git commit -q -m "evidence: UI screenshots for ${GITHUB_SHA::8} (run $GITHUB_RUN_ID)" || true
            git push -q origin "HEAD:refs/heads/$BR" && break
            git reset -q --hard && sleep 5
          done

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuum-ui-evidence
          path: |
            ${{ github.workspace }}/../ui-evidence
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
