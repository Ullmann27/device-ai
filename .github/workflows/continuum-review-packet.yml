name: Continuum Complete Source Review Packet
on:
  workflow_dispatch:
  push:
    branches:
      - copilot/pr-12-working-first-vertical-slice
    paths:
      - .github/continuum/export-review-packet.py
      - .github/workflows/continuum-review-packet.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'reportlab==4.4.4'
      - name: Generate full-source PDF and exact source ZIP
        run: python .github/continuum/export-review-packet.py
      - uses: actions/upload-artifact@v4
        with:
          name: Continuum-Complete-Source-Review
          path: |
            review-packet/Continuum_Complete_Source_Review.pdf
            review-packet/Continuum_Source_Review.zip
            review-packet/MANIFEST.json
            review-packet/GEMINI_TASK.txt
          retention-days: 14
