name: "Code59 - inspect preserved native failure"
on:
  push:
    branches: [diagnostics/code59-native-evidence-20261114]
    paths: [.github/workflows/code59-native-evidence-read.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact preserved artifact
        env:
          CONTINUUM_ARTIFACT_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, re, urllib.error, urllib.request, zipfile
          api = 'https://api.github.com/repos/Ullmann27/device-ai/actions/artifacts/14124305797'
          expected_sha = 'b8c31554ce7416540692f1d30b559be3712495d7'
          expected_digest = '9e8200e3332d3e3523ede2c4244af0a2602377f4e8878d32077281655f1edbfd'
          headers = {'Authorization': 'Bearer ' + os.environ['CONTINUUM_ARTIFACT_TOKEN'],
                     'Accept': 'application/vnd.github+json',
                     'X-GitHub-Api-Version': '2022-11-28'}
          with urllib.request.urlopen(urllib.request.Request(api, headers=headers), timeout=30) as response:
              metadata = json.load(response)
          assert metadata['workflow_run']['head_sha'] == expected_sha
          assert metadata['digest'] == 'sha256:' + expected_digest and not metadata['expired']
          assert metadata['size_in_bytes'] == 101312
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          try:
              opener.open(urllib.request.Request(api + '/zip', headers=headers), timeout=30)
              raise AssertionError('Expected signed artifact redirect')
          except urllib.error.HTTPError as response:
              assert response.code in (301, 302, 303, 307, 308)
              location = response.headers['Location']
          assert location.startswith('https://')
          with urllib.request.urlopen(location, timeout=30) as response:
              data = response.read(metadata['size_in_bytes'] + 1)
          assert len(data) == metadata['size_in_bytes']
          assert hashlib.sha256(data).hexdigest() == expected_digest
          print('NATIVE_ARTIFACT_IDENTITY_PASS source=' + expected_sha + ' digest=' + expected_digest)
          archive = zipfile.ZipFile(io.BytesIO(data))
          infos = archive.infolist()
          assert sum(item.file_size for item in infos) <= 64 * 1024 * 1024
          print('FILES ' + json.dumps([{'name': item.filename, 'bytes': item.file_size} for item in infos]))
          for item in infos:
              name = item.filename
              if not name.startswith('app/') or item.is_dir():
                  continue
              selected = name in ('app/RESULT.json', 'app/activity-lastanr.txt',
                                  'app/dropbox-data-app-anr.txt', 'app/cold-launch.xml')
              selected = selected or re.fullmatch(r'app/anr-trace-[12]\.txt', name) is not None
              if selected:
                  assert item.file_size <= 4 * 1024 * 1024
                  text = archive.read(item).decode('utf-8', errors='replace')
                  lines = text.splitlines()
                  keep = set(range(min(300, len(lines))))
                  for index, line in enumerate(lines):
                      if re.match(r'^"(?:main|RenderThread)"', line):
                          end = index + 1
                          while end < min(len(lines), index + 160) and not lines[end].startswith('"'):
                              end += 1
                          keep.update(range(max(0, index - 3), end))
                  print('BEGIN ' + name + ' total_lines=' + str(len(lines)))
                  for index in sorted(keep):
                      print(str(index + 1) + ': ' + lines[index])
                  print('END ' + name)
              elif name == 'app/logcat.txt':
                  assert item.file_size <= 8 * 1024 * 1024
                  lines = archive.read(item).decode('utf-8', errors='replace').splitlines()
                  keep = set()
                  for index, line in enumerate(lines):
                      if re.search(r'ANR in|Reason:|Input dispatching timed out|FocusEvent|No such file|uiautomator|not idle|Failed to dump|heinz.*(?:FATAL|ActivityTaskManager)', line, re.I):
                          keep.update(range(max(0, index - 4), min(len(lines), index + 35)))
                  print('BEGIN ' + name + ' filtered_lines=' + str(len(keep)))
                  for index in sorted(keep):
                      print(str(index + 1) + ': ' + lines[index])
                  print('END ' + name)
          PY
