name: Jarvis55 - prior QA failure receipts
on:
  push:
    branches: [work/jarvis55-qa-receipts-20261113]
    paths: [.github/workflows/jarvis55-qa-receipts.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    if: github.repository == 'Ullmann27/device-ai' && github.ref == 'refs/heads/work/jarvis55-qa-receipts-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43354416362
          name: Code55-native-PDF-emulator-QA
          path: ${{ runner.temp }}/prior-qa
      - name: Read native runtime evidence
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/prior-qa
        run: |
          python3 - <<'PY'
          import os, pathlib
          root = pathlib.Path(os.environ["EVIDENCE_DIR"])
          print("FILES", [str(file.relative_to(root)) for file in root.rglob("*") if file.is_file()])
          sources = list(root.rglob("source-sha.txt"))
          assert sources and all("fafac263d45645b5193640cb73bf703f33509b91" in file.read_text() for file in sources)
          for file in sorted(root.rglob("*")):
              if not file.is_file(): continue
              name = str(file.relative_to(root))
              if file.name == "surfaceflinger.txt":
                  print("GLES", [line for line in file.read_text().splitlines() if "GLES:" in line])
              elif file.name in ("emulator.log", "native-filament-logcat.txt", "native-filament.txt", "install-app.txt", "install-test.txt", "source-sha.txt", "apk-sha256.txt"):
                  print("NATIVE_FILE", name, file.stat().st_size)
                  print("\n".join(file.read_text(errors="replace").splitlines()[-100:])[-18000:])
          print("READ_ONLY_NATIVE_RECEIPT")
          PY
