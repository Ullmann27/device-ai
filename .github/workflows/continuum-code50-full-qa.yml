name: Continuum Code50 - complete integration QA

on:
  push:
    branches:
      - codex/continuum-code50-integration-20261107
    paths:
      - app/**
      - backend/**
      - scripts/**
      - .github/continuum/**
      - .github/workflows/continuum-code50-full-qa.yml
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code50-full-host-qa
  cancel-in-progress: false

env:
  OWNER_PACKAGE: at.heinz.deviceai.continuumlocal

jobs:
  node-backend:
    if: github.repository == 'Ullmann27/device-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Exact source and release contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          node --test scripts/continuum-atomic-acceptance.test.mjs scripts/continuum-gguf-preflight.test.mjs scripts/continuum-gguf-preflight.integration.test.mjs scripts/continuum-owner-v38-release.test.mjs scripts/continuum-owner-continuous-release.test.mjs scripts/continuum-owner-backend-gate.test.mjs
      - name: Complete critical and Node checks
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
        run: |
          set -euo pipefail
          node scripts/continuum-reliability-qa.mjs critical --out "$RUNNER_TEMP/code50-critical"
          node scripts/continuum-reliability-qa.mjs full-node --out "$RUNNER_TEMP/code50-full"
          node -e "for(const p of ['code50-critical','code50-full']){const r=require(process.env.RUNNER_TEMP+'/'+p+'/report.json');if(r.status!=='PASS'||r.source.commit!==process.env.GITHUB_SHA||!r.sourceUnchanged)process.exit(69);console.log(p+' SOURCE_BOUND_PASS')}"
      - name: Backend check and tests
        run: |
          set -euo pipefail
          npm --prefix backend ci --ignore-scripts --no-audit --no-fund
          npm --prefix backend run check
          npm --prefix backend test
      - name: Save Node evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code50-node-evidence
          path: |
            ${{ runner.temp }}/code50-critical/
            ${{ runner.temp }}/code50-full/
          if-no-files-found: warn
          retention-days: 14

  android-host:
    if: github.repository == 'Ullmann27/device-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK 36 and Android 35 build tools
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Full Android compile, unit/UI tests and lint
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          date +%s%3N > "$RUNNER_TEMP/code50-qa-start.txt"
          gradle --no-daemon --rerun-tasks --max-workers=2 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx1600m -XX:MaxMetaspaceSize=512m' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PdeviceAiMentorPreview=true \
            -PcontinuumUiWidgetTests=true \
            -PcontinuumUiEvidenceDir="$RUNNER_TEMP/code50-ui-frames" \
            -PcontinuumLocalStandaloneQa=true \
            -PcontinuumStandaloneVersionCode=50 \
            :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug
          node scripts/continuum-qa-evidence.mjs android "$PWD" "$(cat "$RUNNER_TEMP/code50-qa-start.txt")" > "$RUNNER_TEMP/code50-android-receipt.json"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Original-package unsigned APK/AAB; never install
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx1600m -XX:MaxMetaspaceSize=512m' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PdeviceAiMentorPreview=true \
            -PcontinuumLocalRenderUnsigned=true \
            -PcontinuumStandaloneVersionCode=50 \
            :app:assembleRelease :app:bundleRelease
          apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" |
            grep -F "package: name='at.heinz.deviceai.continuumlocal' versionCode='50' versionName='0.3.49'"
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "::error::Unsigned QA APK was unexpectedly signed"; exit 69
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/code50-unsigned"
          cp "$apk" "$RUNNER_TEMP/code50-unsigned/Continuum-Code50-UNSIGNED-NOT-INSTALLABLE.apk"
          (cd "$RUNNER_TEMP/code50-unsigned" && sha256sum Continuum-Code50-UNSIGNED-NOT-INSTALLABLE.apk > SHA256SUMS.txt)
          printf 'source_sha=%s\npackage=at.heinz.deviceai.continuumlocal\nversion_code=50\nversion_name=0.3.49\noriginal_signer=NOT_USED\nfold7_test=NOT_RUN\nstatus=QA_UNSIGNED_NOT_INSTALLABLE\n' "$GITHUB_SHA" > "$RUNNER_TEMP/code50-unsigned/BUILD-INFO.txt"
      - name: Archive unsigned QA only
        uses: actions/upload-artifact@v4
        with:
          name: code50-UNSIGNED-NOT-INSTALLABLE
          path: ${{ runner.temp }}/code50-unsigned/
          if-no-files-found: error
          retention-days: 14
      - name: Save Android/UI/lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code50-android-evidence
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/
            ${{ runner.temp }}/code50-ui-frames/
            ${{ runner.temp }}/code50-qa-start.txt
            ${{ runner.temp }}/code50-android-receipt.json
          if-no-files-found: warn
          retention-days: 14
