name: "Code58 Fold7 - Full source-bound Android and Node QA"
on:
  push:
    branches: [fix/code58-fold7-combined-context-20261114]
permissions:
  contents: read
concurrency:
  group: code58-fold7-integrated-full-qa
  cancel-in-progress: true
jobs:
  full-android:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact SHA and clean repository
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 36
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Full unfiltered Android and Robolectric regression suite
        run: |
          set -euo pipefail
          unset CONTINUUM_LOCAL_SIGNING_FILE CONTINUUM_LOCAL_SIGNING_PASSWORD CONTINUUM_MENTOR_SIGNING_FILE CONTINUUM_MENTOR_SIGNING_PASSWORD
          gradle --no-daemon --no-build-cache --max-workers=1 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx2200m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:ActiveProcessorCount=2' \
            -Pkotlin.compiler.execution.strategy=in-process -PdeviceAiMentorPreview=true \
            -PcontinuumOwnerArm64=true -PcontinuumStandaloneVersionCode=58 \
            -PcontinuumLocalStandaloneQa=true -PcontinuumUiWidgetTests=true \
            -I docs/evidence/omega-apk54-20261111/harness/test-memory.gradle \
            :app:testDebugUnitTest
      - name: Assert exact skip policy and critical user failures
        if: always()
        run: |
          set -euo pipefail
          python3 -B tools/code55-apk/junit-summary.py app/build/test-results/testDebugUnitTest --strict-skips
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          files = list(pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          cases = [c for f in files for c in ET.parse(f).getroot().iter('testcase')]
          assert cases, 'Missing JUnit output'
          assert not any(c.find(n) is not None for c in cases for n in ('failure','error'))
          names = {(c.get('classname',''), c.get('name','')) for c in cases if c.find('skipped') is None}
          required = {
            ('at.heinz.deviceai.cognitive.OwnerSessionObjectUtteranceTest','sessionScopedMemoryRequestRetainsObjectForPronounAndCorrection'),
            ('at.heinz.deviceai.cognitive.OwnerSessionObjectUtteranceTest','sessionScopedObjectCannotLeakIntoAnotherConversation'),
            ('at.heinz.deviceai.localmodel.LocalModelContextWindowTest','healthyTwelveGigabytePhoneCanUseAdvertisedEightKContext'),
            ('at.heinz.deviceai.cognitive.OwnerDocumentIntentTest','choosePdfAndSummarizeFirstPageOpensOwnerPicker'),
            ('at.heinz.deviceai.ContinuumHologramMotionUiTest','diagnosticProofDoesNotSilentlyEnableOrPersistNative3d')
          }
          assert required <= names, f'Missing critical cases: {required - names}'
          print(f'FULL_FOLD7_ANDROID_PASS cases={len(cases)}')
          PY
      - name: Retain full Android JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fold7-integrated-full-android-junit
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30
  node-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exact source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - name: Full Node and critical regressions
        run: |
          set -euo pipefail
          node scripts/continuum-reliability-qa.mjs critical --out /tmp/fold7-critical
          node scripts/continuum-reliability-qa.mjs full-node --out /tmp/fold7-full-node
      - name: Backend checks
        run: |
          set -euo pipefail
          npm --prefix backend ci --ignore-scripts --no-audit --no-fund
          npm --prefix backend run check
          npm --prefix backend test
      - name: Retain Node reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fold7-integrated-node-backend
          path: |
            /tmp/fold7-critical/
            /tmp/fold7-full-node/
          if-no-files-found: warn
          retention-days: 30
