name: Read original CI21 evidence
on:
  push:
    branches: [diagnostic/code59-artifact-review-20261114]
permissions:
  actions: read
  contents: read
jobs:
  read-original-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Load exact reader source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import base64, hashlib, json, os, pathlib, re, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          source = os.environ['GITHUB_SHA']
          assert re.fullmatch('[0-9a-f]{40}', source)
          url = 'https://api.github.com/repos/Ullmann27/device-ai/contents/tools/code55-apk/read-ci21-evidence.py?ref=' + source
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          with urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url, headers=headers), timeout=20) as response:
              assert response.status == 200
              body = response.read(65537)
          assert len(body) <= 65536
          metadata = json.loads(body)
          assert metadata['encoding'] == 'base64' and metadata['sha'] == 'e520bbaa3f01a38c1852293296dee8e9e337528d'
          raw = base64.b64decode(''.join(metadata['content'].splitlines()), validate=True)
          assert len(raw) == 13603
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == metadata['sha']
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'read-ci21-evidence.py').write_bytes(raw)
          print('READER_SOURCE_VERIFIED ' + source + ' ' + metadata['sha'])
          PY
      - name: Parse reader
        run: python3 -I -m py_compile "$RUNNER_TEMP/read-ci21-evidence.py"
      - name: Read pinned original evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: timeout -k 5s 250s python3 -I -B "$RUNNER_TEMP/read-ci21-evidence.py"
