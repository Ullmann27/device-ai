name: Code58 capture session isolation QA
on:
  push:
    branches:
      - work/code58-capture-session-regression-20261114
permissions:
  contents: read
concurrency:
  group: code58-capture-session-qa
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - name: Exact source and SDK
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Android regression tests
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/capture-tests.gradle" <<'GRADLE'
          gradle.projectsEvaluated {
              gradle.rootProject.findProject(':app').tasks.withType(org.gradle.api.tasks.testing.Test).matching {
                  it.name == 'testDebugUnitTest'
              }.configureEach {
                  filter {
                      includeTestsMatching 'at.heinz.deviceai.ContinuumProjectionCommandIsolationUiTest'
                      failOnNoMatchingTests = true
                  }
              }
          }
          GRADLE
          gradle --no-daemon --no-build-cache --max-workers=1 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx2200m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:ActiveProcessorCount=2' \
            -Pkotlin.compiler.execution.strategy=in-process -PdeviceAiMentorPreview=true \
            -PcontinuumOwnerArm64=true -PcontinuumStandaloneVersionCode=58 \
            -PcontinuumLocalStandaloneQa=true -PcontinuumUiWidgetTests=true \
            -I docs/evidence/omega-apk54-20261111/harness/test-memory.gradle \
            -I .github/continuum/code58-fold7-routing-tests.init.gradle \
            -I "$RUNNER_TEMP/capture-tests.gradle" :app:testDebugUnitTest
      - name: Require all new lifecycle cases
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          cases = [c for p in pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')
                   for c in ET.parse(p).getroot().iter('testcase')]
          assert cases
          assert not any(c.find(n) is not None for c in cases for n in ('failure','error','skipped'))
          names = {c.get('name') for c in cases if c.get('classname','').endswith('ContinuumProjectionCommandIsolationUiTest')}
          assert names == {'staleStartCannotStopAlreadyBoundCapture','nullStartCannotStopAlreadyBoundCapture',
                           'duplicateStartCannotRepromoteOrReuseConsent','staleStopStillCannotStopAlreadyBoundCapture',
                           'matchingStopStillEndsAlreadyBoundCapture'}, names
          print(f'CAPTURE_SESSION_PASS={len(cases)} FAILED=0 SKIPPED=0')
          PY
      - name: Preserve exact test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Code58-Capture-session-JUnit
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
  unsigned-arm64:
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'
      - name: Compile exact ARM64 candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
          unset CONTINUUM_LOCAL_SIGNING_FILE CONTINUUM_LOCAL_SIGNING_PASSWORD CONTINUUM_MENTOR_SIGNING_FILE CONTINUUM_MENTOR_SIGNING_PASSWORD
          gradle --no-daemon --no-build-cache --max-workers=1 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx2200m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:ActiveProcessorCount=2' \
            -Pkotlin.compiler.execution.strategy=in-process -PdeviceAiMentorPreview=true \
            -PcontinuumOwnerArm64=true -PcontinuumStandaloneVersionCode=58 \
            -PcontinuumLocalRenderUnsigned=true :app:assembleRelease
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/aapt2" dump badging "$apk" > /tmp/badging.txt
          grep -Fq "package: name='at.heinz.deviceai.continuumlocal' versionCode='58' versionName='0.3.57'" /tmp/badging.txt
          grep -Fxq "native-code: 'arm64-v8a'" /tmp/badging.txt
          "$tools/zipalign" -c -P 16 -v 4 "$apk" > /dev/null
          if "$tools/apksigner" verify "$apk" >/dev/null 2>&1; then exit 1; fi
          mkdir -p capture-evidence
          cp "$apk" capture-evidence/Continuum-Code58-UNSIGNED-NOT-INSTALLABLE.apk
          sha256sum capture-evidence/*.apk > capture-evidence/SHA256SUMS.txt
          printf 'source=%s\nversionCode=58\nstatus=UNSIGNED_NOT_INSTALLABLE\nfold7_test=NOT_RUN\n' "$GITHUB_SHA" > capture-evidence/BUILD-INFO.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Code58-Capture-UNSIGNED
          path: capture-evidence/
          if-no-files-found: error
          retention-days: 14
