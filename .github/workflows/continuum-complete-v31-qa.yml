name: Continuum Lokal v31 - Combined Android QA (unsigned)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - release/continuum-local-v30-integration-20261031
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'tools/continuum-virtual-fabric/**'
      - 'docs/release/**'
      - '.github/workflows/continuum-complete-v31-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuum-combined-v31-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combined-unsigned-qa:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # No owner P12 or credentials in the job. QA must remain unsigned.
      CONTINUUM_LOCAL_SIGNING_FILE: ''
      CONTINUUM_LOCAL_SIGNING_PASSWORD: ''
      CONTINUUM_MENTOR_SIGNING_FILE: ''
      CONTINUUM_MENTOR_SIGNING_PASSWORD: ''
    steps:
      - name: Exact PR source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show immutable source identity
        run: |
          git rev-parse HEAD
          git status --porcelain
          node --version
      - name: Enforce every named combined v31 feature
        run: node --test scripts/continuum-v31-feature-gate.test.mjs
      - name: Full combined Node and Android QA (NO signing)
        run: bash scripts/render-continuum-m8-qa.sh
      - name: Verify that QA did not produce an installable signed APK
        run: |
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          grep -Fq 'apk_signed=FALSE' continuum-m8-render-qa/STATUS.txt
          grep -Fq 'version_code=31' continuum-m8-render-qa/STATUS.txt
      - name: Archive test logs (not the unsigned APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuum-v31-source-test-logs
          path: |
            continuum-m8-render-qa/*.txt
            app/build/reports/tests/
            app/build/reports/lint-results*
          if-no-files-found: ignore
          retention-days: 2
