name: "Code58 signer zero-secret contracts"
on:
  push:
    branches:
      - work/code57-voice-original-signer-20261113

permissions:
  contents: read

jobs:
  signer-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Signing scope and immutable action contracts
        run: python3 -B tools/code57-signer/test_workflow_scope.py
      - name: No-secret source validation and wrong-branch rejection
        shell: bash
        env:
          SOURCE_SHA: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          OWNER_APPROVED_SHA: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          QA_RUN_ID: "12345678"
        run: |
          set -Eeuo pipefail
          bash -n scripts/continuum-code57-original-signer.sh
          python3 - <<'PY'
          import ast
          import pathlib
          import re
          script = pathlib.Path("scripts/continuum-code57-original-signer.sh").read_text()
          embedded = re.findall(r"<<'PY'[^\n]*\n(.*?)\nPY", script, re.S)
          assert len(embedded) == 2, f"Expected both source-bound Python validators, found {len(embedded)}"
          for snippet in embedded: ast.parse(snippet)
          print("CODE58_SIGNER_EMBEDDED_PYTHON_PARSE_PASS")
          PY
          grep -Fq 'source_branch=release/code58-full-qa-20261114' scripts/continuum-code57-original-signer.sh
          grep -Fq 'cert=6354e91dc0ca8df9173885f32402fd817f46e798f369206d4fd710ff3d03ee23' scripts/continuum-code57-original-signer.sh
          grep -Fq 'OWNER_SHA_UNAPPROVED' scripts/continuum-code57-original-signer.sh
          grep -Fq 'FOUR_JOBS_NOT_GREEN' scripts/continuum-code57-original-signer.sh
          grep -Fq 'FULL_QA_NOT_GREEN' scripts/continuum-code57-original-signer.sh
          grep -Fq 'SIGNED_DRAFT_NOT_PUBLISHED' scripts/continuum-code57-original-signer.sh
          grep -Fq 'environment: continuum-original-signing' .github/workflows/continuum-code57-original-sign.yml
          grep -Fq 'QA_RUN_ID: "43572572579"' .github/workflows/continuum-code57-original-sign.yml
          grep -Fq 'SOURCE_SHA: "0343cd6234c607bfba856d448ec09d79cc0129ea"' .github/workflows/continuum-code57-original-sign.yml
          grep -Fq 'OWNER_APPROVED_SHA: "0343cd6234c607bfba856d448ec09d79cc0129ea"' .github/workflows/continuum-code57-original-sign.yml
          grep -Fq -- '--draft --latest=false' scripts/continuum-code57-original-signer.sh
          if GITHUB_REPOSITORY=Ullmann27/device-ai GITHUB_REF=refs/heads/work/code57-voice-original-signer-20261113 \
             GITHUB_EVENT_NAME=push GITHUB_SHA="$GITHUB_SHA" \
             bash scripts/continuum-code57-original-signer.sh preflight > /tmp/should-not-run 2>&1; then
            echo "Wrong signing branch was incorrectly admitted" >&2
            exit 1
          fi
          grep -Fq CODE58_SIGN_WRONG_SIGN_BRANCH /tmp/should-not-run
          echo "CODE58_SIGNER_STATIC_CONTRACTS_PASS"
