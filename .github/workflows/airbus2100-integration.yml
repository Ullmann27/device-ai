name: Airbus 2100 integration

on:
  push:
    branches:
      - codex/airbus2100-hollywood-fui-20261108
    paths:
      - scripts/airbus2100_source_map.py
      - scripts/apply_airbus2100.py
      - .github/workflows/airbus2100-integration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airbus2100-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Print production contracts
        run: python3 scripts/airbus2100_source_map.py
