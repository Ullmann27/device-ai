name: "Continuum Code50 — GitHub source QA and unsigned APK"

on:
  push:
    branches:
      - chatgpt/code50-qa-staging-20261108
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuum-code50-github-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  node-backend:
    if: github.repository == 'Ullmann27/device-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Bind source to checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Cockpit, dialogue, Fold7 and app-intent contracts
        run: |
          set -euo pipefail
          node --test --test-concurrency=2             .github/continuum/owner-cockpit-voice-original-orb.test.mjs             .github/continuum/continuum-local-dialogue-quality-wiring.test.mjs             .github/continuum/fold7-portrait-reference.test.mjs             .github/continuum/grounded-recall-android-wiring.test.mjs
      - name: Source-bound full critical and Node QA
        run: |
          set -euo pipefail
          node scripts/continuum-reliability-qa.mjs critical --out "$RUNNER_TEMP/code50-critical"
          node scripts/continuum-reliability-qa.mjs full-node --out "$RUNNER_TEMP/code50-full"
          node -e "for(const p of ['code50-critical','code50-full']){const r=require(process.env.RUNNER_TEMP+'/'+p+'/report.json');if(r.status!=='PASS'||r.source.commit!==process.env.GITHUB_SHA||!r.sourceUnchanged)process.exit(69);console.log(p+' SOURCE_BOUND_PASS')}"
      - name: Backend check and tests
        run: |
          set -euo pipefail
          npm --prefix backend ci --ignore-scripts --no-audit --no-fund
          npm --prefix backend run check
          npm --prefix backend test
      - name: Preserve Node and backend receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code50-github-node-evidence
          path: |
            ${{ runner.temp }}/code50-critical/
            ${{ runner.temp }}/code50-full/
          if-no-files-found: warn
          retention-days: 14

  android-host:
    if: github.repository == 'Ullmann27/device-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OWNER_PACKAGE: at.heinz.deviceai.continuumlocal
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install pinned Android SDK components
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"
      - name: Source-bound Kotlin, JUnit, Robolectric and lint
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          gradle --no-daemon --rerun-tasks --max-workers=2 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx1600m -XX:MaxMetaspaceSize=512m' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PdeviceAiMentorPreview=true \
            -PcontinuumUiWidgetTests=true \
            -PcontinuumLocalStandaloneQa=true \
            -PcontinuumStandaloneVersionCode=50 \
            :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build original-package unsigned APK and AAB
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx1600m -XX:MaxMetaspaceSize=512m' \
            -Pkotlin.compiler.execution.strategy=in-process \
            -PdeviceAiMentorPreview=true -PcontinuumLocalRenderUnsigned=true \
            -PcontinuumStandaloneVersionCode=50 :app:assembleRelease :app:bundleRelease
          apk='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" | \
            grep -F "package: name='at.heinz.deviceai.continuumlocal' versionCode='50' versionName='0.3.49'"
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "::error::Unsigned QA APK must not be signed"; exit 69
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/code50-unsigned"
          cp "$apk" "$RUNNER_TEMP/code50-unsigned/Continuum-Code50-UNSIGNED-NOT-INSTALLABLE.apk"
          (cd "$RUNNER_TEMP/code50-unsigned" && sha256sum Continuum-Code50-UNSIGNED-NOT-INSTALLABLE.apk > SHA256SUMS.txt)
          printf 'status=UNSIGNED_QA_NOT_INSTALLABLE\nsource_sha=%s\npackage=at.heinz.deviceai.continuumlocal\nversionCode=50\nversionName=0.3.49\noriginalSigner=NOT_USED\nFold7=NOT_RUN\n' "$GITHUB_SHA" > "$RUNNER_TEMP/code50-unsigned/BUILD-INFO.txt"
      - name: Upload unsigned APK ONLY if every Android gate passed
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Code50-UNSIGNED-NOT-INSTALLABLE
          path: ${{ runner.temp }}/code50-unsigned/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve Android test and lint receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code50-github-android-evidence
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/
          if-no-files-found: warn
          retention-days: 14
