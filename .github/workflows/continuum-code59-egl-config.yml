name: Observe pinned host EGL configurations
on:
  push:
    branches: [diagnostic/code59-egl-config-20261114]
permissions:
  contents: read
jobs:
  observe-host-egl:
    if: github.repository == 'Ullmann27/device-ai'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Load exact diagnostic source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=2s 25s python3 -I - <<'PY'
          import base64, hashlib, json, os, pathlib, re, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          source = os.environ['GITHUB_SHA']
          assert re.fullmatch('[0-9a-f]{40}', source)
          url = 'https://api.github.com/repos/Ullmann27/device-ai/contents/tools/code55-apk/egl-config-probe.py?ref=' + source
          headers = {
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          with urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url, headers=headers), timeout=20) as response:
              assert response.status == 200 and response.geturl() == url
              body = response.read(65537)
          assert len(body) <= 65536
          metadata = json.loads(body)
          assert metadata['type'] == 'file' and metadata['encoding'] == 'base64'
          assert metadata['path'] == 'tools/code55-apk/egl-config-probe.py'
          assert metadata['sha'] == '7a147718aec9d81f6d08c622e4af1d6eec21b746' and metadata['size'] == 21940
          raw = base64.b64decode(''.join(metadata['content'].splitlines()), validate=True)
          assert len(raw) == 21940
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == metadata['sha']
          destination = pathlib.Path(os.environ['RUNNER_TEMP']) / 'egl-config-probe.py'
          with destination.open('xb') as output:
              output.write(raw)
          print('EGL_DIAGNOSTIC_SOURCE ' + source + ' ' + metadata['sha'])
          PY
      - name: Parse diagnostic source
        shell: bash
        run: python3 -I -m py_compile "$RUNNER_TEMP/egl-config-probe.py"
      - name: Observe original bundled EGL
        shell: bash
        run: timeout --signal=TERM --kill-after=2s 230s python3 -I -B "$RUNNER_TEMP/egl-config-probe.py"
      - name: Preserve raw observations
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: code59-host-egl-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/egl-config-evidence/
          if-no-files-found: error
          retention-days: 14
