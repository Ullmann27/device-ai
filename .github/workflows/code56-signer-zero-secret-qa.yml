name: "Code56 signer zero-secret contracts"
on:
  push:
    branches:
      - work/code56-original-sign-prep-20261113

permissions:
  contents: read

jobs:
  signer-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: No-secret source validation and wrong-branch rejection
        shell: bash
        env:
          SOURCE_SHA: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          OWNER_APPROVED_SHA: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          QA_RUN_ID: "12345678"
        run: |
          set -Eeuo pipefail
          bash -n scripts/continuum-code56-original-signer.sh
          grep -Fq 'source_branch=release/code56-apk-qa-20261113' scripts/continuum-code56-original-signer.sh
          grep -Fq 'cert=6354e91dc0ca8df9173885f32402fd817f46e798f369206d4fd710ff3d03ee23' scripts/continuum-code56-original-signer.sh
          grep -Fq 'OWNER_SHA_UNAPPROVED' scripts/continuum-code56-original-signer.sh
          grep -Fq 'FOUR_JOBS_NOT_GREEN' scripts/continuum-code56-original-signer.sh
          grep -Fq 'FULL_QA_NOT_GREEN' scripts/continuum-code56-original-signer.sh
          grep -Fq 'SIGNED_DRAFT_NOT_PUBLISHED' scripts/continuum-code56-original-signer.sh
          if GITHUB_REPOSITORY=Ullmann27/device-ai GITHUB_REF=refs/heads/work/code56-original-sign-prep-20261113 \
             GITHUB_EVENT_NAME=push GITHUB_SHA="$GITHUB_SHA" \
             bash scripts/continuum-code56-original-signer.sh preflight > /tmp/should-not-run 2>&1; then
            echo "Wrong signing branch was incorrectly admitted" >&2
            exit 1
          fi
          grep -Fq CODE56_SIGN_WRONG_SIGN_BRANCH /tmp/should-not-run
          echo "CODE56_SIGNER_STATIC_CONTRACTS_PASS"
