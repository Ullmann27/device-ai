name: "Code58 Fold7 downloads and web relevance regressions"
on:
  push:
    branches:
      - fix/code57-fold7-downloads-research-20261114
permissions:
  contents: read
jobs:
  fold7-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Exact source
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 36
        run: |
          set -Eeuo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile and run real routing regression cases
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --no-build-cache --max-workers=1 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx2200m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:ActiveProcessorCount=2' \
            -Pkotlin.compiler.execution.strategy=in-process -PdeviceAiMentorPreview=true \
            -PcontinuumOwnerArm64=true -PcontinuumStandaloneVersionCode=58 \
            -PcontinuumLocalStandaloneQa=true -PcontinuumUiWidgetTests=true \
            -I docs/evidence/omega-apk54-20261111/harness/test-memory.gradle \
            -I .github/continuum/code58-fold7-routing-tests.init.gradle :app:testDebugUnitTest
      - name: Require new cases and no failures
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          xmls = pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')
          cases = [c for x in xmls for c in ET.parse(x).getroot().iter('testcase')]
          assert cases and not any(c.find(n) is not None for c in cases for n in ('failure','error','skipped'))
          names = {(c.get('classname','').split('.')[-1],c.get('name')) for c in cases}
          required = {('Fold7RoutingRegressionTest','spokenSingularDownloadUsesApprovedComputerPlan'),
                      ('Fold7RoutingRegressionTest','informalJusticeResearchRemovesSpokenFillerWithoutLosingSubject'),
                      ('Fold7RoutingRegressionTest','funeralAndUnrelatedWebClaimsCannotBecomeJusticeEvidence'),
                      ('ResearchEngineTest','publicSearchRejectsUnrelatedFinalPageTitleAfterDiscovery')}
          assert required <= names, f'Missing regression cases: {required - names}'
          print(f'FOLD7_ROUTING_PASS={len(cases)} FAILED=0 SKIPPED=0')
          PY
      - name: Preserve JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Code58-Fold7-routing-JUnit
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
  unsigned-arm64:
    needs: fold7-routing
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK 36
        run: |
          set -Eeuo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build unsigned Code58 candidate without secrets
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          unset CONTINUUM_LOCAL_SIGNING_FILE CONTINUUM_LOCAL_SIGNING_PASSWORD CONTINUUM_MENTOR_SIGNING_FILE CONTINUUM_MENTOR_SIGNING_PASSWORD
          gradle --no-daemon --no-build-cache --max-workers=1 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx2200m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:ActiveProcessorCount=2' \
            -Pkotlin.compiler.execution.strategy=in-process -PdeviceAiMentorPreview=true \
            -PcontinuumOwnerArm64=true -PcontinuumStandaloneVersionCode=58 \
            -PcontinuumLocalRenderUnsigned=true :app:assembleRelease
      - name: Verify APK version, ABI, and alignment
        run: |
          set -Eeuo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$apk"
          "$tools/aapt2" dump badging "$apk" > /tmp/code58-badging.txt
          grep -Fq "package: name='at.heinz.deviceai.continuumlocal' versionCode='58' versionName='0.3.57'" /tmp/code58-badging.txt
          grep -Fxq "native-code: 'arm64-v8a'" /tmp/code58-badging.txt
          "$tools/zipalign" -c -P 16 -v 4 "$apk" >/dev/null
          if "$tools/apksigner" verify "$apk" >/dev/null 2>&1; then exit 1; fi
          mkdir -p code58-evidence
          cp "$apk" code58-evidence/Continuum-Code58-UNSIGNED-NOT-INSTALLABLE.apk
          sha256sum code58-evidence/*.apk > code58-evidence/SHA256SUMS.txt
          printf 'source=%s\nversionCode=58\nstatus=UNSIGNED_NOT_INSTALLABLE\nfold7_test=NOT_RUN\n' "$GITHUB_SHA" > code58-evidence/BUILD-INFO.txt
      - name: Preserve unsigned candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Code58-UNSIGNED-NOT-INSTALLABLE
          path: code58-evidence/
          if-no-files-found: error
          retention-days: 14
