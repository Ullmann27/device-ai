name: Build Device AI APK

on:
  push:
    branches: [ "main", "v0.2-redesign", "v0.3-agent", "copilot/**" ]
    paths-ignore:
      - ".github/continuum/**"
      - ".github/workflows/continuum-zero-cost.yml"
      - ".continuum/**"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate backend syntax
        run: npm --prefix backend run check

      - name: Test autonomous continuum backend
        run: npm --prefix backend test

      - name: Accept Android SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android 36 SDK
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeviceAI-v0.3-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build side-by-side preview APK
        run: gradle :app:clean :app:assembleDebug -PdeviceAiPreview=true --stacktrace

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: DeviceAI-v0.3.1-preview-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
