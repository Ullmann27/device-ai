name: Code55 native scene pixel review

on:
  push:
    branches: [work/code55-native-visual-20261113]
    paths:
      - app/src/androidTest/**
      - tools/code55-apk/native-filament-visual-emulator.sh
      - .github/workflows/code55-native-visual-review.yml

permissions:
  contents: read

concurrency:
  group: code55-native-pixel-review
  cancel-in-progress: false

jobs:
  native-cockpit-visual:
    if: github.repository == 'Ullmann27/device-ai' && github.ref == 'refs/heads/work/code55-native-visual-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Freeze native probe source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain --untracked-files=normal)"
          git diff --exit-code 889e06d47fffd2230fa5b062dd1f31b65992e728 HEAD -- . \
            ':!app/src/androidTest/java/at/heinz/deviceai/ContinuumVisualInstrumentation.kt' \
            ':!app/src/androidTest/java/at/heinz/deviceai/ContinuumNativeFilamentProbe.kt' \
            ':!app/src/androidTest/java/at/heinz/deviceai/NativeFilamentFrameExport.kt' \
            ':!tools/code55-apk/native-filament-visual-emulator.sh' \
            ':!.github/workflows/code55-native-visual-review.yml' \
            ':!docs/qa/CODE55-NATIVE-PIXEL-REVIEW-20261113.md'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install official native Android runtime
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
          export ANDROID_USER_HOME="$RUNNER_TEMP/continuum-native-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'ANDROID_USER_HOME=%s\n' "$ANDROID_USER_HOME" >> "$GITHUB_ENV"
          printf 'ANDROID_AVD_HOME=%s\n' "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name continuum-native-pdf --package 'system-images;android-35;google_apis;x86_64' \
            --device pixel_7 --path "$ANDROID_AVD_HOME/continuum-native-pdf.avd"
          test -s "$ANDROID_AVD_HOME/continuum-native-pdf.ini"
          test "$("$ANDROID_HOME/emulator/emulator" -list-avds | tr -d '\r')" = continuum-native-pdf
      - name: Prepare native sequence encoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Build disposable native test APKs
        shell: bash
        run: |
          set -euo pipefail
          unset CONTINUUM_LOCAL_SIGNING_FILE CONTINUUM_LOCAL_SIGNING_PASSWORD CONTINUUM_MENTOR_SIGNING_FILE CONTINUUM_MENTOR_SIGNING_PASSWORD
          gradle --no-daemon --no-build-cache --max-workers=1 --console=plain \
            -Dorg.gradle.jvmargs='-Xmx2200m -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -XX:ActiveProcessorCount=2' \
            -Pkotlin.compiler.execution.strategy=in-process -PdeviceAiMentorPreview=true \
            :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Capture actual native scene pixels and lifecycle
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/code55-native-visual"
          mkdir -p "$evidence"
          : "${ANDROID_USER_HOME:?Native user directory missing}"
          : "${ANDROID_AVD_HOME:?Native AVD directory missing}"
          test -s "$ANDROID_AVD_HOME/continuum-native-pdf.ini"
          test -s "$ANDROID_AVD_HOME/continuum-native-pdf.avd/config.ini"
          test -c /dev/kvm
          original_kvm_group="$(stat -c '%g' /dev/kvm)"
          original_kvm_mode="$(stat -c '%a' /dev/kvm)"
          emulator_pid=''
          cleanup() {
            native_exit=$?
            if (( native_exit != 0 )) && [[ -f "$evidence/emulator.log" ]]; then
              cat "$evidence/emulator.log" || true
            fi
            if [[ -n "$emulator_pid" ]]; then
              timeout 10 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 emu kill || true
              kill "$emulator_pid" 2>/dev/null || true
            fi
            sudo chgrp "$original_kvm_group" /dev/kvm
            sudo chmod "$original_kvm_mode" /dev/kvm
            return "$native_exit"
          }
          trap cleanup EXIT
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -no-window -version > "$evidence/emulator-version.txt"
          "$ANDROID_HOME/platform-tools/adb" start-server
          "$ANDROID_HOME/emulator/emulator" -avd continuum-native-pdf -port 5554 -accel on \
            -no-window -no-audio -no-boot-anim -no-snapshot -gpu swangle -memory 2048 -cores 2 \
            > "$evidence/emulator.log" 2>&1 &
          emulator_pid=$!
          ready=false
          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            kill -0 "$emulator_pid"
            if [[ "$(timeout 10 "$ANDROID_HOME/platform-tools/adb" -s emulator-5554 shell -n getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" == 1 ]]; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          printf 'application_source=%s\nharness_source=%s\n' \
            889e06d47fffd2230fa5b062dd1f31b65992e728 "$GITHUB_SHA" > "$evidence/source-binding.txt"
          timeout 600 bash tools/code55-apk/native-filament-visual-emulator.sh emulator-5554 "$evidence"
      - name: Preserve native proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Code55-native-scene-pixel-review
          path: ${{ runner.temp }}/code55-native-visual/
          retention-days: 14
          if-no-files-found: warn

