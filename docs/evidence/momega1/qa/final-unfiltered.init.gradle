allprojects {
 afterEvaluate { p ->
  if (p.name == 'app') {
   p.android.sourceSets.getByName('test').java.srcDir('/workspace/momega1-build-env/android-independent-final')
   p.android.sourceSets.getByName('test').java.srcDir('/workspace/momega1-build-env/workspace-independent-final')
   p.android.sourceSets.getByName('test').java.srcDir('/workspace/momega1-build-env/planning-independent-final-v2')
   p.android.sourceSets.getByName('test').java.srcDir('/workspace/momega1-build-env/reference-independent-final-v2')
   p.android.sourceSets.getByName('test').java.srcDir('/workspace/momega1-build-env/readiness-independent-final')
   p.android.sourceSets.getByName('test').java.srcDir('/workspace/momega1-build-env/guide-independent-caller-final')
   p.android.sourceSets.getByName('test').java.srcDir('/workspace/momega1-build-env/firstwelcome-independent-v2')
  }
 }
 tasks.withType(Test).configureEach {
  executable = '/usr/bin/java'
  systemProperty('continuum.workspace.repo', rootProject.projectDir.absolutePath)
  doFirst { logger.lifecycle('MOMEGA_FINAL_TEST_EXECUTABLE=' + executable) }
 }
}
