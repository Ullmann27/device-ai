import groovy.json.JsonOutput
import java.nio.charset.StandardCharsets
import java.security.MessageDigest

// Explicit PDF-scene host scope.
gradle.projectsEvaluated {
    gradle.rootProject.project(':app').tasks.withType(org.gradle.api.tasks.testing.Test).configureEach { task ->
        if (task.name == 'testDebugUnitTest') {
            task.maxParallelForks = 1
            def allClasses = [
                    'at.heinz.deviceai.ContinuumDocumentFlowUiTest',
                    'at.heinz.deviceai.ContinuumDocumentSceneUiTest',
                    'at.heinz.deviceai.ContinuumPdfSceneAcceptanceUiTest',
                    'at.heinz.deviceai.PdfIntakeCancellationUiTest',
                    'at.heinz.deviceai.PdfIntakeNativeDecodeProbeUiTest',
                    'at.heinz.deviceai.PdfDocumentIntakeTextTest',
                    'at.heinz.deviceai.ui.JarvisPdfWindowPresentationUiTest',
                    'at.heinz.deviceai.ui.DocumentStagePageGeometryUiTest',
                    'at.heinz.deviceai.ui.DocumentStageFrameRefreshUiTest',
                    'at.heinz.deviceai.avatar3d.DocumentStageFrameTest',
                    'at.heinz.deviceai.ui.Cinema2DepthLightTest',
                    'at.heinz.deviceai.ui.JarvisWorkWindowDepthTest',
                    'at.heinz.deviceai.avatar.CinemaWindowGazeBridgeTest',
                    'at.heinz.deviceai.ui.JarvisWindowGazeTest',
                    'at.heinz.deviceai.CinemaNativeSequenceUiTest',
                    'at.heinz.deviceai.CinemaStopReturnUiTest',
                    'at.heinz.deviceai.JarvisWorkWindowUiTest',
                    'at.heinz.deviceai.JarvisWorkWindowLifecycleUiTest',
                    'at.heinz.deviceai.JarvisWorkWindowHostViewportUiTest',
                    'at.heinz.deviceai.JarvisPhoneWorkWindowDensityUiTest',
                    'at.heinz.deviceai.cognitive.OwnerDocumentPresentationIntentTest',
                    'at.heinz.deviceai.cognitive.OwnerDocumentIntentTest',
                    'at.heinz.deviceai.cognitive.OwnerDocumentPoliteIntentTest',
                    'at.heinz.deviceai.cognitive.OwnerDocumentAddressTest',
                    'at.heinz.deviceai.cognitive.DocumentDraftPromptTest'
            ]
            def visualClasses = [
                'at.heinz.deviceai.ContinuumDocumentSceneUiTest',
                'at.heinz.deviceai.CinemaNativeSequenceUiTest',
                'at.heinz.deviceai.CinemaStopReturnUiTest',
                'at.heinz.deviceai.JarvisWorkWindowUiTest',
                'at.heinz.deviceai.JarvisWorkWindowLifecycleUiTest',
                'at.heinz.deviceai.JarvisWorkWindowHostViewportUiTest',
                'at.heinz.deviceai.JarvisPhoneWorkWindowDensityUiTest'
            ]
            def scope = gradle.rootProject.providers.gradleProperty('continuumPdfQaScope').getOrElse('all')
            if (!(scope in ['all', 'core', 'visual'])) {
                throw new GradleException("Unknown continuumPdfQaScope: ${scope}; expected all, core or visual")
            }
            def selectedClasses = scope == 'all' ? allClasses : allClasses.findAll {
                scope == 'visual' ? visualClasses.contains(it) : !visualClasses.contains(it)
            }
            task.filter {
                selectedClasses.each { includeTestsMatching(it) }
                failOnNoMatchingTests = true
            }
            if (gradle.rootProject.providers.gradleProperty('continuumPdfAllowMissingHostNative').orNull == 'true') {
                task.systemProperty('continuum.pdf.allowMissingHostNative', 'true')
            }

            def evidencePath = gradle.rootProject.providers.gradleProperty('continuumUiEvidenceDir').orNull
            if (evidencePath != null) {
                def evidenceDir = gradle.rootProject.file(evidencePath)
                def journal = new File(evidenceDir, 'junit-progress.ndjson')
                def runId = UUID.randomUUID().toString()
                def journalLock = new Object()
                def git = { List<String> arguments ->
                    def command = ['git', '--no-optional-locks', '-C', gradle.rootProject.rootDir.absolutePath] + arguments
                    def process = new ProcessBuilder(command).redirectErrorStream(true).start()
                    def output = process.inputStream.getText('UTF-8')
                    if (process.waitFor() != 0) throw new GradleException("Cannot record Git source: ${output}")
                    output
                }
                def readSource = {
                    def head = git(['rev-parse', '--verify', 'HEAD']).trim()
                    def diff = git(['diff', '--no-ext-diff', '--no-textconv', '--no-color', '--binary', head])
                    [head: head, tree: git(['rev-parse', '--verify', "${head}^{tree}".toString()]).trim(),
                     branch: git(['rev-parse', '--abbrev-ref', 'HEAD']).trim(),
                     repository: git(['rev-parse', '--show-toplevel']).trim(),
                     status: git(['status', '--porcelain=v1', '--untracked-files=all']),
                     trackedDiffSha256: MessageDigest.getInstance('SHA-256')
                         .digest(diff.getBytes(StandardCharsets.UTF_8)).encodeHex().toString()]
                }
                def append = { Map event ->
                    synchronized (journalLock) {
                        def line = JsonOutput.toJson([schema: 1, runId: runId] + event) + '\n'
                        new FileOutputStream(journal, true).withCloseable { output ->
                            output.write(line.getBytes(StandardCharsets.UTF_8))
                            output.flush()
                            output.fd.sync()
                        }
                    }
                }
                def exceptions = { result ->
                    result.exceptions.collect { failure ->
                        def trace = new StringWriter()
                        failure.printStackTrace(new PrintWriter(trace))
                        [type: failure.class.name, message: failure.message, stackTrace: trace.toString()]
                    }
                }
                task.doFirst {
                    if (!evidenceDir.isDirectory() && !evidenceDir.mkdirs()) {
                        throw new GradleException("Cannot create JUnit evidence directory: ${evidenceDir}")
                    }
                    def source = readSource()
                    append([type: 'run_start', at: System.currentTimeMillis(), task: task.path,
                        scope: scope, classes: selectedClasses, source: source, timeUnit: 'epoch_milliseconds',
                        includePatterns: task.filter.includePatterns.toList().sort(),
                        excludePatterns: task.filter.excludePatterns.toList().sort(),
                        environment: [gradle: gradle.gradleVersion, gradleJavaVersion: System.getProperty('java.version'),
                            gradleJavaVendor: System.getProperty('java.vendor'), gradleJavaHome: System.getProperty('java.home'),
                            testJavaExecutable: task.executable, os: System.getProperty('os.name'),
                            arch: System.getProperty('os.arch'), androidHome: System.getenv('ANDROID_HOME'),
                            maxParallelForks: task.maxParallelForks,
                            projectProperties: ['continuumUiWidgetTests', 'continuumLocalStandaloneQa',
                                'continuumStandaloneVersionCode', 'continuumOwnerArm64', 'deviceAiMentorPreview',
                                'continuumPdfAllowMissingHostNative'].collectEntries { key ->
                                [(key): gradle.rootProject.providers.gradleProperty(key).orNull]
                            }]])
                    task.logger.lifecycle("PDF_QA_JOURNAL ${scope} ${runId} ${journal}")
                }
                task.afterTest { descriptor, result ->
                    append([type: 'test_result', 'class': descriptor.className, name: descriptor.name,
                        result: result.resultType.name(), start: result.startTime, end: result.endTime,
                        exceptions: exceptions(result)])
                    task.logger.lifecycle("PDF_QA_TEST ${scope} ${descriptor.className}#${descriptor.name} " +
                        "${result.resultType} ${result.endTime - result.startTime}ms")
                }
                task.afterSuite { descriptor, result ->
                    if (descriptor.parent == null) {
                        append([type: 'suite_end', name: descriptor.name, result: result.resultType.name(),
                            start: result.startTime, end: result.endTime, tests: result.testCount,
                            passed: result.successfulTestCount, failed: result.failedTestCount,
                            skipped: result.skippedTestCount, exceptions: exceptions(result)])
                        task.logger.lifecycle("PDF_QA_SUITE_END ${scope} ${result.resultType} " +
                            "tests=${result.testCount} passed=${result.successfulTestCount} " +
                            "failed=${result.failedTestCount} skipped=${result.skippedTestCount}")
                    }
                }
            }
        }
    }
}
