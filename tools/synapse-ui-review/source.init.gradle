// Adds independent tests to the real Android test source set; excludes nothing.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    def reviewInit = gradle.startParameter.initScripts.find { it.name == 'source.init.gradle' }
    if (reviewInit == null) throw new GradleException('Independent review init path missing')
    app.android.sourceSets.getByName('test').java.srcDir(reviewInit.parentFile)
}

// Only the initial scoped reviewer run opts into this filter. Final QA omits it.
allprojects {
    tasks.withType(Test).configureEach {
        if (providers.gradleProperty('synapseUiReviewOnly').orNull == 'true') {
            filter { includeTestsMatching 'at.heinz.deviceai.IndependentBotRosterUiTest' }
        }
    }
}
