// Independent actual-widget / Activity-listener source. No production exclusions.
gradle.projectsEvaluated {
    def app = gradle.rootProject.project(':app')
    def reviewInit = gradle.startParameter.initScripts.find { it.name == 'connection.init.gradle' }
    if (reviewInit == null) throw new GradleException('Independent connection init path missing')
    app.android.sourceSets.getByName('test').java.srcDir(reviewInit.parentFile)
    app.android.sourceSets.getByName('test').java.srcDir(new File(reviewInit.parentFile.parentFile, 'synapse-ui-review'))
}
allprojects {
    tasks.withType(Test).configureEach {
        if (providers.gradleProperty('genesisUiReviewOnly').orNull == 'true') {
            filter {
                includeTestsMatching 'at.heinz.deviceai.IndependentBotRosterUiTest'
                includeTestsMatching 'at.heinz.deviceai.IndependentActivitySpeechTest'
            }
        }
    }
}
