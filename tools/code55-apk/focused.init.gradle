gradle.projectsEvaluated {
    gradle.rootProject.project(':app').tasks.withType(org.gradle.api.tasks.testing.Test).configureEach { task ->
        if (task.name == 'testDebugUnitTest') {
            task.maxParallelForks = 1
            task.filter {
                includeTestsMatching('at.heinz.deviceai.OwnerAppPlanningContextUiTest')
                includeTestsMatching('at.heinz.deviceai.ContinuumCockpitHandsFreeUiTest')
                includeTestsMatching('at.heinz.deviceai.ContinuumAdaptiveAvatarNavigationUiTest')
                includeTestsMatching('at.heinz.deviceai.avatar3d.*')
                includeTestsMatching('at.heinz.deviceai.cognitive.ContinuousConversationModeTest')
                includeTestsMatching('at.heinz.deviceai.learning.ContinuumCdxLargeCurriculumTest')
                includeTestsMatching('at.heinz.deviceai.cognitive.OwnerComputerWorkflowTest')
                includeTestsMatching('at.heinz.deviceai.cognitive.OwnerComputerIntentParserTest')
                includeTestsMatching('at.heinz.deviceai.cognitive.OwnerComputerTaskGrantTest')
                includeTestsMatching('at.heinz.deviceai.ui.JarvisCockpitFidelityTest')
                includeTestsMatching('at.heinz.deviceai.ui.JarvisCockpitUxArchitectTest')
                includeTestsMatching('at.heinz.deviceai.ui.JarvisReferenceWindowLayoutTest')
                includeTestsMatching('at.heinz.deviceai.ui.JarvisShellContentTest')
                includeTestsMatching('at.heinz.deviceai.ui.JarvisShellLayoutTest')
                includeTestsMatching('at.heinz.deviceai.ui.ComputerPanelPresentationTest')
                includeTestsMatching('at.heinz.deviceai.ContinuumDocumentFlowUiTest')
                includeTestsMatching('at.heinz.deviceai.ResearchChatApprovalUiTest')
                includeTestsMatching('at.heinz.deviceai.AndroidLiveNodePortTest')
                includeTestsMatching('at.heinz.deviceai.AndroidLiveScrollTest')
                includeTestsMatching('at.heinz.deviceai.cognitive.OwnerCorrectionIntentTest')
                includeTestsMatching('at.heinz.deviceai.cognitive.AgentExperienceRecallTest')
                includeTestsMatching('at.heinz.deviceai.cognitive.ExperienceRecallWindowTest')
                includeTestsMatching('at.heinz.deviceai.cognitive.ExperienceRecallRecencyTest')
                includeTestsMatching('at.heinz.deviceai.cognitive.ContinuumRuntimeStoreTest')
                includeTestsMatching('at.heinz.deviceai.learning.NeuralPracticeSchedulerGateUiTest')
                failOnNoMatchingTests = true
            }
        }
    }
}
